<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Comercial RG</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap');

  * { box-sizing: border-box; }

  :root{
    --bg: #F2F5F9;
    --panel: #FFFFFF;
    --panel-2: #EBF0F6;
    --line: #DBE3EC;
    --text: #1A2733;
    --muted: #64748B;
    --amber: #C8850E;
    --amber-dim: #F3DFB8;
    --green: #2F9E64;
    --red: #D6362B;
    --header-ink: #16283D;
    --tigo-blue: #001EB4;
    --shadow: 0 1px 2px rgba(16,24,40,0.04), 0 4px 14px rgba(16,24,40,0.07);
    --shadow-sm: 0 1px 2px rgba(16,24,40,0.05);
    --font-display: 'Space Grotesk', sans-serif;
    --font-body: 'Inter', sans-serif;
  }

  body{
    margin:0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    min-height: 100vh;
  }

  /* ---------- LOGIN ---------- */
  #login-screen{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .login-card{
    width:100%;
    max-width:380px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius:12px;
    padding:40px 32px;
    box-shadow: var(--shadow);
  }
  .login-card h1{
    font-family: var(--font-display);
    font-size:1.4rem;
    font-weight:600;
    margin:0 0 6px;
  }
  .login-card p{
    color: var(--muted);
    font-size:0.9rem;
    margin:0 0 28px;
    line-height:1.5;
  }
  .login-card input{
    width:100%;
    padding:12px 14px;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius:3px;
    color: var(--text);
    font-family: var(--font-body);
    font-size:0.95rem;
    margin-bottom:14px;
  }
  .login-card input:focus{
    outline:none;
    border-color: var(--amber);
  }
  .login-card button{
    width:100%;
    padding:12px 14px;
    background: var(--amber);
    color:#1A1200;
    border:none;
    border-radius:3px;
    font-family: var(--font-body);
    font-weight:600;
    font-size:0.95rem;
    cursor:pointer;
  }
  .login-card button:hover{ background:#f0b357; }
  #login-error{
    color: var(--red);
    font-size:0.85rem;
    margin-top:10px;
    min-height:1em;
  }
  .login-hint{
    margin-top:22px;
    padding-top:18px;
    border-top:1px solid var(--line);
    font-size:0.78rem;
    color: var(--muted);
  }

  /* ---------- DASHBOARD ---------- */
  #dashboard{ display:none; }
  header.top{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    padding: 26px 40px 24px;
    background: linear-gradient(120deg, var(--tigo-blue) 0%, #0029C4 100%);
    flex-wrap:wrap;
    gap:16px;
    box-shadow: var(--shadow);
  }
  .brand-badge{
    display:inline-flex;
    align-items:center;
    gap:6px;
    background: rgba(255,255,255,0.14);
    border:1px solid rgba(255,255,255,0.32);
    color:#FFFFFF;
    font-family: var(--font-display);
    font-weight:700;
    font-size:0.68rem;
    letter-spacing:0.1em;
    padding:4px 10px;
    border-radius:20px;
    margin-bottom:10px;
  }
  header.top h1{
    font-family: var(--font-display);
    font-weight:700;
    font-size:1.6rem;
    margin:0 0 4px;
    letter-spacing:-0.01em;
    color:#FFFFFF;
  }
  header.top .sub{
    color: rgba(255,255,255,0.78);
    font-size:0.88rem;
  }
  .meta-info{
    text-align:right;
    font-size:0.8rem;
    color: rgba(255,255,255,0.7);
  }
  .meta-info .date{
    color: #FFFFFF;
    font-weight:500;
    font-size:0.9rem;
  }

  nav.tabs{
    display:flex;
    gap:4px;
    padding: 18px 40px 0;
    overflow-x:auto;
  }
  nav.tabs button{ white-space:nowrap; flex:0 0 auto; }
  nav.tabs button{
    background:none;
    border:none;
    color: var(--muted);
    font-family: var(--font-body);
    font-weight:600;
    font-size:0.88rem;
    padding:10px 18px;
    cursor:pointer;
    border-bottom: 2px solid transparent;
  }
  nav.tabs button.active{
    color: var(--text);
    border-bottom: 2px solid var(--amber);
  }

  main{
    padding: 28px 40px 60px;
    max-width:1280px;
  }

  .section-label{
    font-family: var(--font-display);
    font-size:0.85rem;
    font-weight:600;
    color: var(--tigo-blue);
    margin: 0 0 14px;
  }

  .kpi-row{
    display:grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap:16px;
    margin-bottom:32px;
  }
  .kpi-card{
    background: var(--panel);
    border:1px solid var(--line);
    border-top:3px solid var(--tigo-blue);
    border-radius:12px;
    padding:18px 20px;
    box-shadow: var(--shadow-sm);
  }
  .kpi-card .kpi-value{
    font-family: var(--font-display);
    font-size:1.85rem;
    font-weight:700;
    color: var(--tigo-blue);
    line-height:1.15;
  }
  .kpi-card .kpi-value.good{ color: var(--green); }
  .kpi-card .kpi-value.mid{ color: var(--amber); }
  .kpi-card .kpi-value.bad{ color: var(--red); }
  .kpi-card .kpi-label{
    font-size:0.8rem;
    color: var(--muted);
    font-weight:600;
    margin-top:6px;
  }
  .kpi-card .kpi-sub{
    font-size:0.75rem;
    color: var(--muted);
    margin-top:2px;
  }

  .gauge-row{
    display:grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap:16px;
    margin-bottom:36px;
  }
  .gauge-card{
    background: var(--panel);
    border:1px solid var(--line);
    border-radius:12px;
    padding:20px;
    display:flex;
    flex-direction:column;
    align-items:center;
    box-shadow: var(--shadow-sm);
  }
  .gauge-card .name{
    font-weight:600;
    font-size:0.92rem;
    margin-bottom:2px;
  }
  .gauge-card .role{
    font-size:0.75rem;
    color: var(--muted);
    margin-bottom:10px;
  }
  .gauge-card .pct-label{
    font-family: var(--font-display);
    font-size:1.5rem;
    font-weight:700;
    margin-top:-52px;
  }
  .gauge-card .meta-line{
    font-size:0.75rem;
    color: var(--muted);
    margin-top:10px;
  }

  .fo-split .blk{ border-left:2px solid var(--line); }
  .fo-split td.lt50{ color:var(--muted); }
  .fo-split th.lt50{ opacity:.75; }
  .lower-grid{
    display:grid;
    grid-template-columns: 340px 1fr;
    gap:24px;
    align-items:start;
  }
  @media (max-width: 900px){
    .lower-grid{ grid-template-columns: 1fr; }
  }

  .donut-card{
    background: var(--panel);
    border:1px solid var(--line);
    border-radius:12px;
    padding:24px;
    box-shadow: var(--shadow-sm);
  }
  .funnel-gallery{
    display:grid;
    grid-template-columns: 1fr;
    gap:16px;
    margin-bottom:24px;
  }
  .funnel-thumb{
    display:block;
    border:1px solid var(--line);
    border-radius:8px;
    overflow:hidden;
    background: var(--panel);
    box-shadow: var(--shadow-sm);
  }
  .funnel-thumb img{
    display:block;
    width:100%;
    height:auto;
  }
  .donut-card h3{
    font-family: var(--font-display);
    font-size:1rem;
    margin:0 0 18px;
    font-weight:600;
  }
  .donut-wrap{
    display:flex;
    align-items:center;
    gap:20px;
  }
  .legend{
    font-size:0.82rem;
  }
  .legend-item{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:8px;
  }
  .legend-dot{
    width:9px; height:9px; border-radius:50%;
  }
  .legend-val{ color: var(--muted); margin-left:auto; padding-left:14px; }

  table{
    width:100%;
    border-collapse:collapse;
    background: var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    overflow:hidden;
    box-shadow: var(--shadow-sm);
  }
  thead th{
    text-align:left;
    font-size:0.75rem;
    color: var(--tigo-blue);
    font-weight:600;
    padding:12px 16px;
    border-bottom:1px solid var(--line);
  }
  tbody td{
    padding:12px 16px;
    font-size:0.87rem;
    border-bottom:1px solid var(--line);
  }
  tbody tr:last-child td{ border-bottom:none; }
  .pill{
    display:inline-block;
    padding:3px 9px;
    border-radius:10px;
    font-size:0.75rem;
    font-weight:600;
  }
  .pill.good{ background: rgba(76,175,125,0.15); color: var(--green); }
  .pill.bad{ background: rgba(226,87,76,0.15); color: var(--red); }
  .pill.mid{ background: rgba(232,163,61,0.15); color: var(--amber); }

  .general-table-wrap{
    overflow-x:auto;
    border:1px solid var(--line);
    border-radius:10px;
    box-shadow: var(--shadow-sm);
  }
  table.general{
    width:100%;
    border-collapse:collapse;
    background: var(--panel);
    min-width:900px;
  }
  table.general th, table.general td{
    padding:10px 14px;
    font-size:0.83rem;
    text-align:center;
    border-bottom:1px solid var(--line);
    border-right:1px solid var(--line);
    white-space:nowrap;
  }
  table.general th:last-child, table.general td:last-child{ border-right:none; }
  table.general td:first-child, table.general th.name-col{
    text-align:left;
    font-weight:600;
  }
  table.general thead tr.group-row th{
    font-family: var(--font-display);
    font-weight:600;
    font-size:0.78rem;
    color: var(--header-ink);
    padding:10px 14px;
  }
  table.general thead tr.group-row th.g-movil{ background: var(--amber); }
  table.general thead tr.group-row th.g-fo{ background: #7FBF9E; }
  table.general thead tr.group-row th.g-sspp{ background: #6FA3D8; }
  table.general thead tr.group-row th.g-name{ background: var(--panel-2); color: var(--text); }
  table.general thead tr.sub-row th{
    background: var(--panel-2);
    color: var(--tigo-blue);
    font-weight:600;
    font-size:0.72rem;
  }
  table.general tbody td.pct-cell{ font-weight:700; }
  table.general tbody tr.total-row td{
    background: var(--panel-2);
    font-weight:700;
    color: var(--text);
  }
  table.general tbody tr.total-row td.pct-cell.good{ color: var(--green); }
  table.general tbody tr.total-row td.pct-cell.mid{ color: var(--amber); }
  table.general tbody tr.total-row td.pct-cell.bad{ color: var(--red); }

  .detail-table-wrap{
    overflow-x:auto;
    border:1px solid var(--line);
    border-radius:10px;
    box-shadow: var(--shadow-sm);
    margin-top:36px;
  }
  table.detail{
    width:100%;
    border-collapse:collapse;
    background: var(--panel);
    min-width:820px;
  }
  table.detail th, table.detail td{
    padding:10px 14px;
    font-size:0.83rem;
    text-align:center;
    border-bottom:1px solid var(--line);
    border-right:1px solid var(--line);
    white-space:nowrap;
  }
  table.detail th:last-child, table.detail td:last-child{ border-right:none; }
  table.detail td.name-cell{ text-align:left; }
  table.detail thead tr.group-row th{
    font-family: var(--font-display);
    font-weight:600;
    font-size:0.78rem;
    color: var(--header-ink);
    padding:10px 14px;
  }
  table.detail thead tr.group-row th.g-name{ background: var(--panel-2); color: var(--text); }
  table.detail thead tr.group-row th.g-fvi{ background: var(--amber); }
  table.detail thead tr.group-row th.g-fq{ background: #6FA3D8; }
  table.detail thead tr.group-row th.g-visado{ background: #A07FD8; }
  table.detail thead tr.sub-row th{
    background: var(--panel-2);
    color: var(--tigo-blue);
    font-weight:600;
    font-size:0.72rem;
  }
  table.detail tbody tr.jefe-row{ cursor:pointer; }
  table.detail tbody tr.jefe-row td{ font-weight:700; background: rgba(15,30,45,0.035); }
  table.detail tbody tr.jefe-row .name-cell{
    display:flex; align-items:center; gap:8px;
  }
  table.detail tbody tr.jefe-row .caret{
    display:inline-block;
    transition: transform 0.15s ease;
    color: var(--muted);
    font-size:0.7rem;
  }
  table.detail tbody tr.jefe-row.expanded .caret{ transform: rotate(90deg); }
  table.detail tbody tr.exec-row td{ color: var(--muted); font-size:0.8rem; }
  table.detail tbody tr.exec-row td.name-cell{ padding-left:32px; }
  table.detail tbody tr.exec-row.hidden{ display:none; }
  table.detail tbody tr.total-row td{
    background: var(--panel-2);
    font-weight:700;
    color: var(--text);
  }
  table.detail td.na{ color: var(--line); }

  .equipo-list{
    display:flex;
    flex-direction:column;
    gap:10px;
    margin-top:14px;
  }
  .equipo-card{
    background: var(--panel);
    border:1px solid var(--line);
    border-radius:6px;
    padding:4px 14px;
  }
  .equipo-card-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    padding:8px 0;
    font-size:0.85rem;
  }
  .equipo-card-row + .equipo-card-row{ border-top:1px solid var(--line); }
  .equipo-card-label{ color: var(--muted); }
  .equipo-card-nav{ font-weight:700; color: var(--text); text-align:right; }
  .equipo-empty{ color: var(--muted); font-size:0.85rem; padding:16px 0; }

  .canal-block{
    margin-bottom:36px;
  }
  .canal-block h3{
    font-family: var(--font-display);
    font-size:1.05rem;
    font-weight:600;
    margin:0 0 14px;
    display:flex;
    align-items:baseline;
    gap:10px;
  }
  .canal-count{
    font-family: var(--font-body);
    font-size:0.78rem;
    color: var(--muted);
    font-weight:400;
  }
  table.asesores-table th.name-col{ text-align:left; }
  table.asesores-table td.name-cell{ text-align:left; }
  table.asesores-table tbody tr.exec-row td:nth-child(2){
    text-align:left;
    font-size:0.78rem;
    line-height:1.6;
  }


  /* ---------- EVOLUTIVO ---------- */
  .evo-grid{
    display:grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap:16px;
    margin-bottom:36px;
  }
  @media (max-width: 1100px){
    .evo-grid{ grid-template-columns: 1fr; }
  }
  .evo-grid.evo-wide{ grid-template-columns: 1fr; }
  .evo-card{
    background: var(--panel);
    border:1px solid var(--line);
    border-radius:12px;
    padding:16px 16px 10px;
    box-shadow: var(--shadow-sm);
    min-width:0;
  }
  .evo-card-head{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    gap:10px;
    flex-wrap:wrap;
  }
  .evo-card-title{
    font-family: var(--font-display);
    font-weight:700;
    font-size:1rem;
    color: var(--text);
  }
  .evo-card-unit{
    font-family: var(--font-body);
    font-weight:400;
    font-size:0.75rem;
    color: var(--muted);
    margin-left:6px;
  }
  .evo-legend{
    display:flex;
    gap:12px;
    font-size:0.72rem;
    color: var(--muted);
    align-items:center;
  }
  .evo-legend span{ display:inline-flex; align-items:center; gap:5px; }
  .evo-acum{
    font-size:0.8rem;
    color: var(--muted);
    margin:6px 0 10px;
  }
  .evo-acum b{ color: var(--text); }
  .evo-chart{ width:100%; }
  .evo-chart svg{ display:block; font-family: var(--font-body); font-variant-numeric: tabular-nums; }
  .evo-hit{ fill: transparent; cursor: default; outline:none; }
  .evo-hit:hover, .evo-hit:focus{ fill: rgba(0,30,180,0.07); }
  .evo-empty{
    color: var(--muted);
    font-size:0.85rem;
    padding:28px 0 34px;
    text-align:center;
  }
  .evo-chips{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin: 0 0 16px;
  }
  .evo-chips button{
    background: var(--panel);
    border:1px solid var(--line);
    color: var(--text);
    font-family: var(--font-body);
    font-weight:600;
    font-size:0.82rem;
    padding:7px 14px;
    border-radius:20px;
    cursor:pointer;
  }
  .evo-chips button.active{
    background: var(--tigo-blue);
    border-color: var(--tigo-blue);
    color:#FFFFFF;
  }
  table.evo-table td .evo-v{ font-weight:700; font-size:0.9rem; color: var(--text); }
  table.evo-table td .evo-m{ font-size:0.72rem; font-weight:400; color: var(--muted); margin:1px 0 4px; }
  table.evo-table td.evo-nometa{ color: var(--muted); }
  .evo-note{
    font-size:0.78rem;
    color: var(--muted);
    margin:10px 0 0;
    line-height:1.5;
  }
  .evo-gap{ height:36px; }
  .evo-dl{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:10px 18px;
    background: var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    padding:12px 16px;
    margin:0 0 24px;
    max-width:760px;
  }
  .evo-dl-info{ flex:1 1 260px; min-width:0; }
  .evo-dl-info b{ display:block; font-size:0.9rem; color: var(--text); }
  .evo-dl-info span{ display:block; font-size:0.78rem; color: var(--muted); margin-top:2px; line-height:1.4; }
  .evo-dl button{
    background: var(--amber);
    color:#1A1200;
    border:none;
    border-radius:3px;
    font-family: var(--font-body);
    font-weight:600;
    font-size:0.85rem;
    padding:9px 16px;
    cursor:pointer;
  }
  .evo-dl button:disabled{ opacity:0.6; cursor:default; }
  .evo-dl-form{ flex:1 1 100%; display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
  .evo-dl-form input{
    flex:1 1 200px;
    min-width:0;
    padding:9px 12px;
    background: var(--bg);
    border:1px solid var(--line);
    border-radius:3px;
    color: var(--text);
    font-size:0.85rem;
  }
  .evo-dl-status{ flex:1 1 100%; font-size:0.82rem; color: var(--muted); }
  .evo-vistas{
    display:inline-flex;
    background: var(--panel-2);
    border:1px solid var(--line);
    border-radius:10px;
    padding:4px;
    gap:4px;
    margin:0 0 24px;
    flex-wrap:wrap;
  }
  .evo-vistas button{
    background:transparent;
    border:none;
    color: var(--muted);
    font-family: var(--font-display);
    font-weight:600;
    font-size:0.88rem;
    padding:9px 18px;
    border-radius:7px;
    cursor:pointer;
  }
  .evo-vistas button.active{ background: var(--panel); color: var(--tigo-blue); box-shadow: var(--shadow-sm); }
  table.evo-table td .evo-tk{ font-size:0.78rem; font-weight:700; color: var(--tigo-blue); }
  .evo-chips.evo-chips-sm{ margin-top:-6px; }
  .evo-chips.evo-chips-sm button{ font-size:0.76rem; padding:5px 12px; }
  .evo-chips .evo-chips-lbl{ font-size:0.76rem; color: var(--muted); align-self:center; margin-right:2px; }
  .evo-sub-label{
    font-family: var(--font-display);
    font-weight:700;
    font-size:0.92rem;
    color: var(--text);
    margin:20px 0 10px;
  }
  .evo-sub-label span{ font-family: var(--font-body); font-weight:400; font-size:0.78rem; color: var(--muted); margin-left:8px; }
  table.evo-sup-table{ font-variant-numeric: tabular-nums; }
  table.evo-sup-table th, table.evo-sup-table td{ padding:7px 12px; text-align:right; }
  table.evo-sup-table td:first-child, table.evo-sup-table th.name-col{ text-align:left; }
  table.evo-sup-table tbody tr.evo-jefe-row td{ background:#F6F8FB; font-weight:700; color: var(--text); }
  table.evo-sup-table tbody tr.evo-sup-row td{ font-weight:400; }
  table.evo-sup-table tbody tr.evo-sup-row td:first-child{ padding-left:30px; font-weight:400; }
  table.evo-sup-table td.evo-zero{ color:#B4BFCC; }

const METAS_VIS_KEY = 'dv-metas-visible';
function metasVisible(){
  const q = window.location.search;
  const on = /[?&]metas=1(&|$)/.test(q), off = /[?&]metas=0(&|$)/.test(q);
  try{
    if(on) localStorage.setItem(METAS_VIS_KEY, '1');
    if(off) localStorage.removeItem(METAS_VIS_KEY);
    return localStorage.getItem(METAS_VIS_KEY) === '1';
  }catch(e){ return on; }
}

// El total de la tabla (la meta de Gerencia) se recalcula mientras se escriben las metas, sin esperar a guardar.
function metasRecalcTotales(){
  const fmt = n => Number(n).toLocaleString('es-CL');
  let cambios = false;
  for(const k of ['voz','fo','sspp']){
    let t = 0;
    for(let i=0;i<METAS_JEFES.length;i++){
      const el = document.getElementById(`meta-${k}-${i}`);
      if(!el) return;
      const v = Number(el.value);
      const ok = el.value.trim() !== '' && isFinite(v) && v >= 0;
      if(ok) t += v;
      if(!ok || v !== METAS[i][k]) cambios = true;
    }
    const td = document.getElementById('metas-total-' + k);
    if(td) td.textContent = fmt(t);
  }
  const aviso = document.getElementById('metas-pendiente');
  if(aviso) aviso.style.display = cambios ? 'block' : 'none';
}

async function handleSaveMetas(){
  const statusEl = document.getElementById('metas-status');
  const pass = document.getElementById('metas-password').value;
  const nuevas = [];
  for(let i=0;i<METAS_JEFES.length;i++){
    const m = {};
    for(const k of ['voz','fo','sspp']){
      const raw = document.getElementById(`meta-${k}-${i}`).value.trim();
      const v = Number(raw);
      if(raw === '' || !isFinite(v) || v < 0){
        statusEl.textContent = 'Revisa la meta de ' + METAS_JEFES[i] + ': debe ser un número igual o mayor a 0.';
        return;
      }
      m[k] = v;
    }
    nuevas.push(m);
  }
  if(!pass){ statusEl.textContent = 'Ingresa la clave de carga.'; return; }
  statusEl.textContent = 'Guardando metas...';
  try{
    const nowIso = new Date().toISOString();
    const res = await fetch('/api/save-data', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ password: pass, key: 'metas-data', data: { metas: nuevas, updatedAt: nowIso } })
    });
    const result = await res.json();
    if(!res.ok){
      statusEl.textContent = 'Error: ' + (result.error || 'no se pudo guardar. Revisa la clave.');
      return;
    }
    METAS = nuevas;
    METAS_UPDATED_AT = nowIso;
    renderCargarDatos();
    document.getElementById('metas-status').textContent = 'Listo. Metas guardadas; el cumplimiento ya se calcula con las nuevas metas.';
  } catch(e){
    statusEl.textContent = 'Error al guardar: ' + e.message;
  }
}

function metaFor(jefeName, campo){
  const idx = jefeSortIndex(jefeName);
  const m = METAS[idx];
  return m ? m[campo] : 0;
}

function pctCump(total, meta){
  if(!meta) return 0;

let asesorSearchTerm = '';

function normSearch(s){
  return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
}

function matchesSearch(row, term){
  if(!term) return true;
  const t = normSearch(term);
  return normSearch(row.jefe).includes(t) || normSearch(row.supervisor).includes(t) || normSearch(row.asesor).includes(t) || normSearch(row.rut).includes(t);
}

function onAsesorSearchInput(value){
  asesorSearchTerm = value;

function pctColor(pct){
  if(pct >= 95) return getComputedStyle(document.documentElement).getPropertyValue('--green').trim();
  if(pct >= 80) return getComputedStyle(document.documentElement).getPropertyValue('--amber').trim();
  return getComputedStyle(document.documentElement).getPropertyValue('--red').trim();
}

function pillClass(pct){
  if(pct >= 95) return 'good';
  if(pct >= 80) return 'mid';
  return 'bad';
}

function gaugeSVG(pct){
  const clamped = Math.min(pct, 130);
  const angle = Math.min((clamped/130) * 270, 270);
  const r = 54;
  const cx = 70, cy = 70;
  const startAngle = 135;
  const endAngle = startAngle + angle;

  function polar(cx, cy, r, angleDeg){
    const rad = (angleDeg - 90) * Math.PI / 180;
    return { x: cx + r * Math.cos(rad), y: cy + r * Math.sin(rad) };
  }

  const bgStart = polar(cx, cy, r, 135);
  const bgEnd = polar(cx, cy, r, 405);
  const start = polar(cx, cy, r, startAngle);
  const end = polar(cx, cy, r, endAngle);
  const largeArcBg = 1;
  const largeArc = angle > 180 ? 1 : 0;
  const color = pctColor(pct);
  const trackColor = getComputedStyle(document.documentElement).getPropertyValue('--line').trim();

  return `
  <svg width="140" height="90" viewBox="0 0 140 90">
    <path d="M ${bgStart.x} ${bgStart.y} A ${r} ${r} 0 ${largeArcBg} 1 ${bgEnd.x} ${bgEnd.y}"
      fill="none" stroke="${trackColor}" stroke-width="10" stroke-linecap="round"/>
    <path d="M ${start.x} ${start.y} A ${r} ${r} 0 ${largeArc} 1 ${end.x} ${end.y}"
      fill="none" stroke="${color}" stroke-width="10" stroke-linecap="round"/>
  </svg>`;
}

function donutSVG(segments){
  const total = segments.reduce((s,d)=>d.value+s,0);
  let cumulative = 0;
  const r = 46, cx = 60, cy = 60, sw = 20;
  const circumference = 2 * Math.PI * r;

  const arcs = segments.map(seg=>{
    const frac = seg.value/total;
    const dash = frac * circumference;
    const gap = circumference - dash;
    const offset = -cumulative * circumference;
    cumulative += frac;
    return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${seg.color}" stroke-width="${sw}"
      stroke-dasharray="${dash} ${gap}" stroke-dashoffset="${offset}" transform="rotate(-90 ${cx} ${cy})"/>`;
  }).join('');

  return `<svg width="120" height="120" viewBox="0 0 120 120">${arcs}</svg>`;
}

// Calcula en vivo (a partir de MAQUINA_SUMMARY, FO_SUMMARY y SSPP_SUMMARY, que sí se
// actualizan con cada carga de Excel) los mismos datos que antes venían fijos en GENERAL.
// Así "Vista General" y el resumen Móvil siempre reflejan la última base cargada.
function computeGeneralSummary(){
  const rows = CANONICAL_JEFES.map(name=>{
    const idx = jefeSortIndex(name);

    const mRow = MAQUINA_SUMMARY.rows.find(r=>jefeSortIndex(r.jefe)===idx);
    const vozFvi = mRow ? mRow.fvi.aaa : 0;
    const vozFq = mRow ? mRow.fq.aaa : 0;
    const vozTotal = vozFvi + vozFq;
    const vozPct = pctCump(vozTotal, metaFor(name,'voz'));

    // FO en Vista General se basa solo en Terminadas (suma=1) por canal, no en Terminada+Pendiente.
    const foRow = FO_SUMMARY.jefes.find(r=>jefeSortIndex(r.jefe)===idx);
    const foFvi = foRow ? (foRow.terminadaFvi||0) : 0;
    const foFq = foRow ? (foRow.terminadaFq||0) : 0;
    const foTotal = foFvi + foFq;
    const foTerminada = foRow ? foRow.terminada : 0;
    const foPct = pctCump(foTerminada, metaFor(name,'fo'));

    const ssppRow = SSPP_SUMMARY.jefes.find(r=>jefeSortIndex(r.jefe)===idx);
    const ssppFvi = ssppRow ? ssppRow.navGestion : 0;
    const ssppNav = ssppRow ? ssppRow.navInternet : 0;
    const ssppPct = SSPP_EXCLUDED_JEFES.includes(name) ? 0 : pctCump(ssppFvi, metaFor(name,'sspp'));

    return { name, vozFvi, vozFq, vozTotal, vozPct, foFvi, foFq, foTotal, foPct, ssppFvi, ssppNav, ssppPct };
  });

  const sum = (key)=>rows.reduce((s,r)=>s+r[key],0);
  const vozFviT = sum('vozFvi'), vozFqT = sum('vozFq'), vozTotalT = vozFviT + vozFqT;
  const vozPctT = pctCump(vozTotalT, METAS.reduce((s,m)=>s+m.voz,0));

  const foFviT = sum('foFvi'), foFqT = sum('foFq'), foTotalT = foFviT + foFqT;
  const foTerminadaT = FO_SUMMARY.jefes.reduce((s,r)=>s+r.terminada,0);
  const foPctT = pctCump(foTerminadaT, METAS.reduce((s,m)=>s+m.fo,0));

  const ssppRowsForTotal = rows.filter(r=>!SSPP_EXCLUDED_JEFES.includes(r.name));
  const ssppFviT = ssppRowsForTotal.reduce((s,r)=>s+r.ssppFvi,0);
  const ssppNavT = ssppRowsForTotal.reduce((s,r)=>s+r.ssppNav,0);
  const ssppMetaT = ssppRowsForTotal.reduce((s,r)=>s+metaFor(r.name,'sspp'),0);
  const ssppPctT = pctCump(ssppFviT, ssppMetaT);

  return {
    period: GENERAL.period,
    rows,
    total: {
      name: 'Total',
      vozFvi: vozFviT, vozFq: vozFqT, vozTotal: vozTotalT, vozPct: vozPctT,
      foFvi: foFviT, foFq: foFqT, foTotal: foTotalT, foPct: foPctT,
      ssppFvi: ssppFviT, ssppNav: ssppNavT, ssppPct: ssppPctT
    }
  };
}

function normKey(s){
  return String(s === undefined || s === null ? '' : s).trim();
}

function computeFromBBDDRows(jsonRows){
  const valid = jsonRows.filter(r => ['AAA','Logística','Visado'].includes(normKey(r['ESTADO 2'])));

  function groupByCanal(canal){
    const sub = valid.filter(r => normKey(r['CANAL']) === canal);
    const map = new Map();
    for(const r of sub){
      const jefe = normKey(r['JEFE COMERCIAL']);
      const sup = normKey(r['SUPERVISOR']);
      const key = jefe + '|||' + sup;
      if(!map.has(key)) map.set(key, {jefe, supervisor: sup, AAA:0, Despacho:0, Entregado:0, PendienteAsesor:0, Agendamiento:0, EsperaVisado:0, Seguridad:0});
      const g = map.get(key);
      const estado1 = normKey(r['ESTADO 1']);
      const ql = Number(r['Q L']) || 0;
      if(estado1 === 'AAA') g.AAA += ql;
      else if(estado1 === 'Despacho') g.Despacho += ql;
      else if(estado1 === 'Entregado') g.Entregado += ql;
      else if(estado1 === 'Pendiente asesor') g.PendienteAsesor += ql;
      else if(estado1 === 'Agendamiento') g.Agendamiento += ql;
      else if(estado1 === 'Espera visado') g.EsperaVisado += ql;
      else if(estado1 === 'Seguridad') g.Seguridad += ql;
    }
    return Array.from(map.values());
  }

  function buildEstados(groups){
    const rows = groups.map(g=>{
      const logSub = g.Despacho + g.Entregado;
      const visSub = g.PendienteAsesor + g.Agendamiento + g.EsperaVisado + g.Seguridad;
      return { jefe: g.jefe, supervisor: g.supervisor, aaa: g.AAA, despacho: g.Despacho, entregado: g.Entregado,
        logSub, pendienteAsesor: g.PendienteAsesor, agendamiento: g.Agendamiento, esperaVisado: g.EsperaVisado, seguridad: g.Seguridad,
        visSub, total: g.AAA + logSub + visSub };
    });
    const total = rows.reduce((acc,r)=>{
      acc.aaa+=r.aaa; acc.despacho+=r.despacho; acc.entregado+=r.entregado; acc.logSub+=r.logSub;
      acc.pendienteAsesor+=r.pendienteAsesor; acc.agendamiento+=r.agendamiento; acc.esperaVisado+=r.esperaVisado; acc.seguridad+=r.seguridad;
      acc.visSub+=r.visSub; acc.total+=r.total; return acc;
    }, {aaa:0,despacho:0,entregado:0,logSub:0,pendienteAsesor:0,agendamiento:0,esperaVisado:0,seguridad:0,visSub:0,total:0});
    return { rows, total };
  }

  function buildEstado2(groups){
    const rows = groups.map(g=>{
      const log = g.Despacho + g.Entregado;
      const vis = g.PendienteAsesor + g.Agendamiento + g.EsperaVisado + g.Seguridad;
      return { jefe: g.jefe, supervisor: g.supervisor, aaa: g.AAA, logistica: log, visado: vis, total: g.AAA+log+vis };
    });
    const total = rows.reduce((acc,r)=>{ acc.aaa+=r.aaa; acc.logistica+=r.logistica; acc.visado+=r.visado; acc.total+=r.total; return acc; }, {aaa:0,logistica:0,visado:0,total:0});
    return { rows, total };
  }

  const fviGroups = groupByCanal('FVI');
  const fqGroups = groupByCanal('FQ');
  const estadosFvi = buildEstados(fviGroups);
  const estadosFq = buildEstados(fqGroups);
  const estado2Fvi = buildEstado2(fviGroups);
  const estado2Fq = buildEstado2(fqGroups);

  // Detalle por Jefe Comercial + Supervisor + Asesor (para la tabla "Detalle de ventas
  // por Jefe Comercial, Supervisor y Asesor" y su buscador).
  function groupByCanalAsesor(canal){
    const sub = valid.filter(r => normKey(r['CANAL']) === canal);
    const map = new Map();
    for(const r of sub){
      const jefe = normKey(r['JEFE COMERCIAL']);
      const sup = normKey(r['SUPERVISOR']);
      const asesor = normKey(r['NOMBRE ASESOR ']) || normKey(r['NOMBRE ASESOR']);
      const rut = normKey(r['RUT ASESOR']);
      const key = jefe + '|||' + sup + '|||' + asesor + '|||' + rut;
      if(!map.has(key)) map.set(key, { jefe, supervisor: sup, asesor, rut, AAA:0, Despacho:0, Entregado:0, PendienteAsesor:0, Agendamiento:0, EsperaVisado:0, Seguridad:0 });
      const g = map.get(key);
      const estado1 = normKey(r['ESTADO 1']);
      const ql = Number(r['Q L']) || 0;
      if(estado1 === 'AAA') g.AAA += ql;
      else if(estado1 === 'Despacho') g.Despacho += ql;
      else if(estado1 === 'Entregado') g.Entregado += ql;
      else if(estado1 === 'Pendiente asesor') g.PendienteAsesor += ql;
      else if(estado1 === 'Agendamiento') g.Agendamiento += ql;
      else if(estado1 === 'Espera visado') g.EsperaVisado += ql;
      else if(estado1 === 'Seguridad') g.Seguridad += ql;
    }
    return Array.from(map.values())
      .map(g=>{
        const logistica = g.Despacho + g.Entregado;
        const visado = g.PendienteAsesor + g.Agendamiento + g.EsperaVisado + g.Seguridad;
        return { jefe: g.jefe, supervisor: g.supervisor, asesor: g.asesor, rut: g.rut,
          aaa: g.AAA, logistica, visado, total: g.AAA + logistica + visado };
      })
      .sort((a,b)=> jefeSortIndex(a.jefe)-jefeSortIndex(b.jefe) || a.supervisor.localeCompare(b.supervisor) || a.asesor.localeCompare(b.asesor));
  }
  const asesorDetalleFvi = groupByCanalAsesor('FVI');
  const asesorDetalleFq = groupByCanalAsesor('FQ');

  function maquinaTotalsByCanal(sub, canal){
    const canalRows = sub.filter(r => normKey(r['CANAL']) === canal);
    let aaa = 0, maquina = 0;
    for(const r of canalRows){
      const em = normKey(r['ESTADO MAQUINA']);
      const ql = Number(r['Q L']) || 0;
      if(em === 'AAA') aaa += ql;
      else if(em === 'Máquina') maquina += ql;
    }
    return { aaa, maquina, total: aaa + maquina };
  }

  const jefesSet = new Set(jsonRows.map(r => normKey(r['JEFE COMERCIAL'])).filter(Boolean));
  const maquinaRows = Array.from(jefesSet).map(jefe=>{
    const sub = jsonRows.filter(r => normKey(r['JEFE COMERCIAL']) === jefe);
    return { jefe, fvi: maquinaTotalsByCanal(sub, 'FVI'), fq: maquinaTotalsByCanal(sub, 'FQ') };
  });
  const maquinaTotal = maquinaRows.reduce((acc,r)=>{
    acc.fvi.aaa += r.fvi.aaa; acc.fvi.maquina += r.fvi.maquina; acc.fvi.total += r.fvi.total;
    acc.fq.aaa += r.fq.aaa; acc.fq.maquina += r.fq.maquina; acc.fq.total += r.fq.total;
    return acc;
  }, { fvi:{aaa:0,maquina:0,total:0}, fq:{aaa:0,maquina:0,total:0} });
  const maquinaSummary = { rows: maquinaRows, total: maquinaTotal };

  const cleanRawRows = jsonRows.map(r=>{
    const clean = {};
    for(const k in r){
      if(!k.startsWith('Unnamed')) clean[k] = r[k];
    }
    return clean;
  });

  return {
    estadosFviRows: estadosFvi.rows, estadosFviTotal: estadosFvi.total,

    estado2FviRows: estado2Fvi.rows, estado2FviTotal: estado2Fvi.total,

    maquinaSummary,
    asesorDetalleFvi,
    asesorDetalleFq,
    rawRows: cleanRawRows,
    updatedAt: new Date().toISOString()
  };
}

// ---------- FO: cálculo automático desde BBDD_FO.xlsx (hoja MAESTRO) ----------
const CANONICAL_JEFES = GENERAL.rows.map(r=>r.name);

function currentPeriodYYYYMM(){
  const now = new Date();
  return String(now.getFullYear()) + String(now.getMonth()+1).padStart(2,'0');
}

// Desglose por monto de la tabla de Estados: suma=1 es Mayor a 50M, suma=2 es Menor a 50M.
// Usa las mismas reglas que Emisiones/Terminada/Pendiente, pero separando suma 1 y 2.
function foMontoSplit(rows, period){
  const mk = ()=>({ fvi1:0, fvi2:0, fq1:0, fq2:0 });
  const out = { emisiones: mk(), terminada: mk(), pendiente: mk() };
  // Desglose por Jefe Comercial (mismo orden fijo de siempre)
  out.jefes = CANONICAL_JEFES.map(name=>({ jefe:name, terminada: mk(), pendiente: mk() }));
  for(const row of rows || []){
    const estado = String(row['ESTADO']||'').trim().toUpperCase();
    const canal = String(row['CANAL']||row['Columna1']||'').trim().toUpperCase();
    const suma = String(row['suma']||'').trim();
    const canalKey = canal === 'FVI' ? 'fvi' : (canal === 'FQ' ? 'fq' : null);
    if(!canalKey || (suma !== '1' && suma !== '2')) continue;
    const k = canalKey + suma;
    const esEmision = String(row['Fecha emision']||'').trim() === period && Number(row['CUENTA REMISION']) === 1;
    const jefeName = String(row['JC']||'').trim().replace(/\s+(FQ|FVI)$/i, '').trim();
    const jIdx = jefeSortIndex(jefeName);
    const jEntry = jIdx < CANONICAL_JEFES.length ? out.jefes[jIdx] : null;
    if(esEmision) out.emisiones[k]++;
    if(estado === 'TERMINADA'){ out.terminada[k]++; if(jEntry) jEntry.terminada[k]++; }
    if(estado === 'PENDIENTE'){ out.pendiente[k]++; if(jEntry) jEntry.pendiente[k]++; }
  }
  return out;
}

function periodFromDate(iso){
  const d = iso ? new Date(iso) : new Date();
  if(isNaN(d)) return currentPeriodYYYYMM();
  return String(d.getFullYear()) + String(d.getMonth()+1).padStart(2,'0');
}

function computeFromBBDDFO(jsonRows){
  const period = currentPeriodYYYYMM();
  function jefeFromJC(jc){
    return String(jc||'').trim().replace(/\s+(FQ|FVI)$/i, '').trim();
  }

  const term = { fvi:0, fq:0 };
  const pend = { fvi:0, fq:0 };
  const emis = { fvi:0, fq:0 };
  let mayor50 = 0, menor50 = 0;
  const jefeAgg = CANONICAL_JEFES.map(name=>({ jefe:name, fvi:0, fq:0, total:0, terminada:0, terminadaFvi:0, terminadaFq:0, pendienteFvi:0, pendienteFq:0 }));
  const empresaMap = new Map();
  function ensureEmpresa(nombre){
    if(!empresaMap.has(nombre)) empresaMap.set(nombre, { empresa: nombre, emisiones:0, terminada:0, pendiente:0 });
    return empresaMap.get(nombre);
  }

  for(const row of jsonRows){
    const estado = String(row['ESTADO']||'').trim().toUpperCase();
    const canal = String(row['CANAL']||row['Columna1']||'').trim().toUpperCase();
    const suma = String(row['suma']||'').trim();
    const cuentaRemision = Number(row['CUENTA REMISION']);
    const fechaEmisionPeriodo = String(row['Fecha emision']||'').trim();
    const jefeIdx = jefeSortIndex(jefeFromJC(row['JC']));
    const canalKey = canal === 'FVI' ? 'fvi' : (canal === 'FQ' ? 'fq' : null);
    const jefeEntry = jefeIdx < CANONICAL_JEFES.length ? jefeAgg[jefeIdx] : null;
    const esEmision = fechaEmisionPeriodo === period && cuentaRemision === 1;
    const empresaNombre = String(row['NOMBRE_EMPRESA_SELLER']||'').trim() || 'Sin empresa';

    // Terminada: solo cuenta filas con suma=1 (evita duplicar reemisiones)
    if(estado === 'TERMINADA' && suma === '1' && canalKey){
      term[canalKey]++;
      if(jefeEntry){
        jefeEntry[canalKey]++; jefeEntry.total++; jefeEntry.terminada++;
        if(canalKey === 'fvi') jefeEntry.terminadaFvi++; else jefeEntry.terminadaFq++;
      }
      ensureEmpresa(empresaNombre).terminada++;
    }
    // Pendiente: solo cuenta filas con suma=1
    if(estado === 'PENDIENTE' && canalKey && suma === '1'){
      pend[canalKey]++;
      if(jefeEntry){
        jefeEntry[canalKey]++; jefeEntry.total++;
        if(canalKey === 'fvi') jefeEntry.pendienteFvi++; else jefeEntry.pendienteFq++;
      }
      ensureEmpresa(empresaNombre).pendiente++;
    }
    // Emisiones: fecha de emisión del mes en curso + cuenta remisión = 1, solo filas con suma=1
    if(esEmision && canalKey && suma === '1'){
      emis[canalKey]++;
      ensureEmpresa(empresaNombre).emisiones++;
    }
    // Distribución por monto: dentro de Emisiones, suma=1 es Mayor a 50MM, suma=2 es Menor a 50MM
    if(esEmision){
      if(suma === '1') mayor50++;
      else if(suma === '2') menor50++;
    }
  }

  const porEmpresa = Array.from(empresaMap.values()).sort((a,b)=>(b.terminada+b.pendiente)-(a.terminada+a.pendiente));

  const termTotal = term.fvi + term.fq;
  const pendTotal = pend.fvi + pend.fq;
  const emisTotal = emis.fvi + emis.fq;

  const cleanRawRowsFO = jsonRows.map(r=>{
    const clean = {};
    for(const k in r){
      if(!k.startsWith('Unnamed')) clean[k] = r[k];
    }
    return clean;
  });

  return {
    estados: {
      emisiones: { fvi: emis.fvi, fq: emis.fq, total: emisTotal },
      terminada: { fvi: term.fvi, fq: term.fq, total: termTotal },
      pendiente: { fvi: pend.fvi, fq: pend.fq, total: pendTotal },
      total: { fvi: term.fvi+pend.fvi, fq: term.fq+pend.fq, total: termTotal+pendTotal }
    },
    monto: { mayor50, menor50 },
    split: foMontoSplit(jsonRows, period),
    jefes: jefeAgg,
    porEmpresa,
    rawRows: cleanRawRowsFO,
    updatedAt: new Date().toISOString()
  };
}

async function deleteFOImage(imgIndex){
  const pw = getSavedFunnelPassword();

  const ok = confirm('¿Eliminar esta imagen? Se guardará el cambio para todos los que vean el dashboard.');

  const images = FO_IMAGES.slice();
  images.splice(imgIndex, 1);
  try{
    const nowIso = new Date().toISOString();
    const res = await fetch('/api/save-data', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ password: pw, key: 'fo-images-data', data: { images, updatedAt: nowIso } })
    });
    const result = await res.json();
    if(!res.ok){
      alert('Error al eliminar: ' + (result.error || 'no se pudo guardar. Revisa la clave.'));
      return;
    }
    applyRemoteDataFOImages({ images, updatedAt: nowIso });
    if(activeTab === 'fo') renderContent();
  } catch(e){
    alert('Hubo un problema de conexión al eliminar la imagen. Intenta de nuevo.');
  }
}

let SSPP_POR_SUPERVISOR = [];
let SSPP_POR_ASESOR = [];
let ssppEquipoSearchTerm = '';

function computeFromBBDDSSPP(jsonRows){
  const gitMaquina = CANONICAL_JEFES.map(name=>({ jefe:name, git:0, maquina:0, total:0 }));
  const etapaSet = new Set();
  const etapaByJefe = CANONICAL_JEFES.map(name=>({ jefe:name, counts:{}, total:0 }));
  const resumen = CANONICAL_JEFES.map(name=>({ jefe:name, navGestion:0, navInternet:0 }));
  const supervisorMap = new Map();
  const asesorMap = new Map();

  for(const row of jsonRows){
    const jefeRaw = String(row['JEFE COMERCIAL']||'').trim();
    if(!jefeRaw) continue;
    const jefeIdx = jefeSortIndex(jefeRaw);
    if(jefeIdx >= CANONICAL_JEFES.length) continue;
    const jefeNombre = CANONICAL_JEFES[jefeIdx];

    const navGestionRow = Number(row['NAV Gestion']);
    const navGestionVal = isNaN(navGestionRow) ? 0 : navGestionRow;

    const etapa = String(row['ETAPA SISON 2']||'').trim();

    // % de avance SSPP: suma de NAV Gestión y NAV Internet por Jefe Comercial, solo de los
    // casos donde Columna2 = "GIT" (mismo criterio que la columna GIT de la tabla GIT/Máquina).
    const c2 = String(row['Columna2']||'').trim().toUpperCase();
    const navInternetRow = Number(row['NAV Internet']);
    const navInternetVal = isNaN(navInternetRow) ? 0 : navInternetRow;
    if(c2 === 'GIT'){
      gitMaquina[jefeIdx].git += navGestionVal; gitMaquina[jefeIdx].total += navGestionVal;
      resumen[jefeIdx].navGestion += navGestionVal;
      resumen[jefeIdx].navInternet += navInternetVal;
    }
    else if(c2 === 'MAQUINA'){ gitMaquina[jefeIdx].maquina += navGestionVal; gitMaquina[jefeIdx].total += navGestionVal; }

    if(etapa){
      etapaSet.add(etapa);
      const entry = etapaByJefe[jefeIdx];
      entry.counts[etapa] = (entry.counts[etapa] || 0) + navGestionVal;
      entry.total += navGestionVal;
    }

    // Detalle por Jefe Comercial + Supervisor, y por Jefe Comercial + Supervisor + Asesor
    const supervisor = String(row['SUPERVISOR']||'').trim() || 'Sin dato';
    const asesor = String(row['EJECUTIVO']||'').trim() || 'Sin dato';
    const rutAsesor = String(row['Rut Asesor']||'').trim();

    const supKey = jefeIdx+'|'+supervisor;
    if(!supervisorMap.has(supKey)) supervisorMap.set(supKey, { jefe: jefeNombre, supervisor, navGestion:0, git:0, maquina:0, casos:0 });
    const supEntry = supervisorMap.get(supKey);
    supEntry.navGestion += navGestionVal;
    if(c2 === 'GIT') supEntry.git += navGestionVal;
    else if(c2 === 'MAQUINA') supEntry.maquina += navGestionVal;
    supEntry.casos += 1;

    const asesorKey = jefeIdx+'|'+supervisor+'|'+asesor+'|'+rutAsesor;
    if(!asesorMap.has(asesorKey)) asesorMap.set(asesorKey, { jefe: jefeNombre, supervisor, asesor, rut: rutAsesor, navGestion:0, git:0, maquina:0, casos:0 });
    const asEntry = asesorMap.get(asesorKey);
    asEntry.navGestion += navGestionVal;
    if(c2 === 'GIT') asEntry.git += navGestionVal;
    else if(c2 === 'MAQUINA') asEntry.maquina += navGestionVal;
    asEntry.casos += 1;
  }

  resumen.forEach(r=>{ r.navGestion = Math.round(r.navGestion); r.navInternet = Math.round(r.navInternet); });
  gitMaquina.forEach(g=>{ g.git = Math.round(g.git); g.maquina = Math.round(g.maquina); g.total = Math.round(g.total); });
  etapaByJefe.forEach(e=>{
    Object.keys(e.counts).forEach(k=>{ e.counts[k] = Math.round(e.counts[k]); });
    e.total = Math.round(e.total);
  });
  const porSupervisor = Array.from(supervisorMap.values());
  porSupervisor.forEach(r=>{ r.navGestion = Math.round(r.navGestion); r.git = Math.round(r.git); r.maquina = Math.round(r.maquina); });
  const porAsesor = Array.from(asesorMap.values());
  porAsesor.forEach(r=>{ r.navGestion = Math.round(r.navGestion); r.git = Math.round(r.git); r.maquina = Math.round(r.maquina); });

  const cleanRawRowsSSPP = jsonRows.map(r=>{
    const clean = {};
    for(const k in r){
      if(!k.startsWith('Unnamed')) clean[k] = r[k];
    }
    return clean;
  });

  return {
    gitMaquina,
    etapas: Array.from(etapaSet).sort(),
    etapaPorJefe: etapaByJefe,
    resumen,
    porSupervisor,
    porAsesor,
    rawRows: cleanRawRowsSSPP,
    updatedAt: new Date().toISOString()
  };
}

  SSPP_ETAPA_POR_JEFE = d.etapaPorJefe || [];
  if(d.resumen) SSPP_SUMMARY.jefes = d.resumen;
  SSPP_POR_SUPERVISOR = d.porSupervisor || [];

// Reduce el tamaño de una imagen (máx 1600px de lado, JPEG) antes de subirla, para
// que la carga sea rápida y no se acerque al límite de tamaño de almacenamiento.
function compressImageFile(file, maxDim, quality){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onerror = ()=>reject(new Error('No se pudo leer la imagen "' + file.name + '"'));
    reader.onload = ()=>{
      const img = new Image();
      img.onerror = ()=>reject(new Error('No se pudo procesar la imagen "' + file.name + '"'));
      img.onload = ()=>{
        let w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
        if(w > maxDim || h > maxDim){
          if(w >= h){ h = Math.round(h * maxDim / w); w = maxDim; }
          else { w = Math.round(w * maxDim / h); h = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

// Agrega una imagen (venga de pegar, arrastrar o seleccionar un archivo) a la lista
// de imágenes pendientes por subir de esa sección, comprimiéndola primero.
async function addFunnelStagedImage(section, file){
  const slug = funnelSlug(section);
  const statusEl = document.getElementById('funnel-images-status-' + slug);
  try{
    const dataUrl = await compressImageFile(file, 1600, 0.82);
    const staged = funnelStagedForSection(section);
    staged.push({ name: file.name || ('imagen-' + (staged.length + 1) + '.jpg'), dataUrl });
    if(statusEl) statusEl.textContent = '';
  } catch(e){
    if(statusEl) statusEl.textContent = 'No se pudo agregar una imagen: ' + e.message;
  }
  renderFunnelStagedPreview(section);
}

function removeFunnelStagedImage(sectionIndex, i){
  const section = FUNNEL_SECTIONS[sectionIndex];
  funnelStagedForSection(section).splice(i, 1);
  renderFunnelStagedPreview(section);
}

function renderFunnelStagedPreview(section){
  const slug = funnelSlug(section);
  const sectionIndex = FUNNEL_SECTIONS.indexOf(section);
  const staged = funnelStagedForSection(section);
  const el = document.getElementById('funnel-staged-preview-' + slug);
  if(el){
    el.innerHTML = staged.map((im,i)=>`
      <div class="funnel-thumb" style="position:relative;">
        <a href="${im.dataUrl}" target="_blank" rel="noopener" title="Ver imagen completa">
          <img src="${im.dataUrl}" alt="${im.name}">
        </a>
        <button type="button" onclick="removeFunnelStagedImage(${sectionIndex}, ${i})" title="Quitar"
          style="position:absolute; top:4px; right:4px; width:22px; height:22px; border:none; border-radius:50%; background:rgba(20,20,20,0.65); color:#fff; font-size:0.8rem; line-height:1; cursor:pointer;">×</button>
      </div>
    `).join('');
  }
  const countEl = document.getElementById('funnel-staged-count-' + slug);
  if(countEl) countEl.textContent = staged.length;
  // La clave y el botón de subir solo aparecen una vez que hay alguna imagen pendiente —
  // mientras la sección está vacía, se ve solo la zona de pegar/arrastrar, sin ruido extra.
  const controls = document.getElementById('funnel-upload-controls-' + slug);
  if(controls) controls.style.display = staged.length ? 'block' : 'none';
}

// Conecta la zona de "pega o arrastra" de cada sección de la pestaña Funnel.
// Se llama cada vez que se vuelve a dibujar la pestaña, porque renderContent() reemplaza el HTML.
function attachFunnelUploadListeners(){
  FUNNEL_SECTIONS.forEach(section=>{
    const slug = funnelSlug(section);
    const zone = document.getElementById('funnel-paste-zone-' + slug);
    if(zone){
      zone.addEventListener('paste', (e)=>{
        const items = Array.from((e.clipboardData && e.clipboardData.items) || []).filter(it=>it.type && it.type.indexOf('image/') === 0);
        if(!items.length) return;
        e.preventDefault();
        items.forEach(it=>{
          const file = it.getAsFile();
          if(file) addFunnelStagedImage(section, file);
        });
      });
      zone.addEventListener('dragover', (e)=>{ e.preventDefault(); zone.style.background = 'var(--panel-2)'; });
      zone.addEventListener('dragleave', ()=>{ zone.style.background = 'var(--bg)'; });
      zone.addEventListener('drop', (e)=>{
        e.preventDefault();
        zone.style.background = 'var(--bg)';
        const files = Array.from((e.dataTransfer && e.dataTransfer.files) || []).filter(f=>f.type && f.type.indexOf('image/') === 0);
        files.forEach(f=>addFunnelStagedImage(section, f));
      });
    }
    renderFunnelStagedPreview(section);
  });
}

async function handleFunnelImagesUpload(sectionIndex){
  const section = FUNNEL_SECTIONS[sectionIndex];
  const slug = funnelSlug(section);
  const passInput = document.getElementById('funnel-images-password-' + slug);
  const statusEl = document.getElementById('funnel-images-status-' + slug);
  const staged = funnelStagedForSection(section);
  if(!staged.length){ statusEl.textContent = 'Agrega al menos una imagen: pégala (Ctrl+V), arrástrala o selecciónala.'; return; }
  const approxKB = Math.round(staged.reduce((s,im)=>s+im.dataUrl.length,0)/1024);
  if(approxKB > 18000){
    statusEl.textContent = 'Las imágenes pesan mucho incluso comprimidas (~' + approxKB.toLocaleString('es-CL') + ' KB). Quita algunas antes de subir.';
    return;
  }
  statusEl.textContent = 'Subiendo imágenes...';
  try{
    const nowIso = new Date().toISOString();
    const newImagesBySection = Object.assign({}, FUNNEL_IMAGES_BY_SECTION, { [section]: staged });
    const res = await fetch('/api/save-data', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ password: passInput.value, key: 'funnel-data', data: { imagesBySection: newImagesBySection, file: FUNNEL_FILE, updatedAt: nowIso } })
    });
    const result = await res.json();
    if(!res.ok){
      statusEl.textContent = 'Error: ' + (result.error || 'no se pudo guardar. Revisa la clave.');
      return;
    }
    applyRemoteDataFunnel({ imagesBySection: newImagesBySection, file: FUNNEL_FILE, updatedAt: nowIso });
    FUNNEL_STAGED_BY_SECTION[section] = [];
    saveFunnelPassword(passInput.value);
    statusEl.textContent = 'Listo. Imágenes actualizadas para todos los que vean el dashboard.';
    if(activeTab === 'funnel') renderContent();
  } catch(e){
    statusEl.textContent = 'Hubo un problema de conexión al subir las imágenes (puede pasar por una red inestable). Tus imágenes no se perdieron: vuelve a apretar "Subir imágenes" para intentarlo de nuevo.';
  }
}

// Elimina una imagen que ya estaba subida (no una pendiente), guardando el cambio al tiro para
// todos los que vean el dashboard. Usa la clave que ya quedó recordada en este navegador.
async function deleteFunnelImage(sectionIndex, imgIndex){
  const section = FUNNEL_SECTIONS[sectionIndex];
  const pw = getSavedFunnelPassword();
  if(!pw){ alert('Todavía no tienes una clave guardada en este navegador. Sube una imagen una vez con la clave y después vas a poder borrar desde aquí.'); return; }
  const ok = confirm('¿Eliminar esta imagen de "' + section + '"? Se guardará el cambio para todos los que vean el dashboard.');
  if(!ok) return;
  const images = funnelImagesForSection(section).slice();
  images.splice(imgIndex, 1);
  const newImagesBySection = Object.assign({}, FUNNEL_IMAGES_BY_SECTION, { [section]: images });
  try{
    const nowIso = new Date().toISOString();
    const res = await fetch('/api/save-data', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ password: pw, key: 'funnel-data', data: { imagesBySection: newImagesBySection, file: FUNNEL_FILE, updatedAt: nowIso } })
    });
    const result = await res.json();
    if(!res.ok){
      alert('Error al eliminar: ' + (result.error || 'no se pudo guardar. Revisa la clave.'));
      return;
    }
    applyRemoteDataFunnel({ imagesBySection: newImagesBySection, file: FUNNEL_FILE, updatedAt: nowIso });
    if(activeTab === 'funnel') renderContent();
  } catch(e){
    alert('Hubo un problema de conexión al eliminar la imagen. Intenta de nuevo.');
  }
}

async function handleFunnelFileUpload(){
  const fileInput = document.getElementById('funnel-file-input');
  const passInput = document.getElementById('funnel-file-password');
  const statusEl = document.getElementById('funnel-file-status');
  if(!fileInput.files.length){ statusEl.textContent = 'Selecciona un archivo primero.'; return; }
  const file = fileInput.files[0];
  const MAX_BYTES = 8 * 1024 * 1024;
  if(file.size > MAX_BYTES){
    statusEl.textContent = 'El archivo pesa ' + Math.round(file.size/1024/1024) + ' MB. El máximo permitido es 8 MB.';
    return;
  }
  statusEl.textContent = 'Procesando archivo...';
  try{
    const dataUrl = await new Promise((resolve, reject)=>{
      const reader = new FileReader();
      reader.onload = ()=>resolve(reader.result);
      reader.onerror = ()=>reject(new Error('No se pudo leer el archivo'));
      reader.readAsDataURL(file);
    });
    const newFile = { name: file.name, dataUrl, mime: file.type || 'application/octet-stream' };
    statusEl.textContent = 'Subiendo archivo...';
    const nowIso = new Date().toISOString();
    const res = await fetch('/api/save-data', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ password: passInput.value, key: 'funnel-data', data: { imagesBySection: FUNNEL_IMAGES_BY_SECTION, file: newFile, updatedAt: nowIso } })
    });
    const result = await res.json();
    if(!res.ok){
      statusEl.textContent = 'Error: ' + (result.error || 'no se pudo guardar. Revisa la clave.');
      return;
    }
    applyRemoteDataFunnel({ imagesBySection: FUNNEL_IMAGES_BY_SECTION, file: newFile, updatedAt: nowIso });
    saveFunnelPassword(passInput.value);
    statusEl.textContent = 'Listo. Archivo actualizado para todos los que vean el dashboard.';
    fileInput.value = '';
    if(activeTab === 'funnel') renderContent();
  } catch(e){
    statusEl.textContent = 'Hubo un problema al subir el archivo (puede pasar por una red inestable). Vuelve a apretar "Subir archivo" para intentarlo de nuevo.';
  }
}

const DOWNLOAD_PASSWORDS = {
  "Gerencia2026$": "all",
  "Supervisor2026$": "FVI"
};

const DOWNLOAD_SOURCES = {
  movil: { label: 'Móvil', getRows: ()=>RAW_ROWS, hasCanal: true },
  fo: { label: 'FO', getRows: ()=>RAW_ROWS_FO, hasCanal: true },

};

function handleDownloadBBDD(){
  const passInput = document.getElementById('download-password');
  const statusEl = document.getElementById('download-status');
  const baseSel = document.querySelector('input[name="download-base"]:checked');
  const pass = passInput.value;

  if(!DOWNLOAD_PASSWORDS.hasOwnProperty(pass)){
    statusEl.textContent = 'Clave incorrecta.';
    return;
  }
  if(!baseSel){
    statusEl.textContent = 'Selecciona qué base de datos quieres descargar.';
    return;
  }

  const source = DOWNLOAD_SOURCES[baseSel.value];
  const allRows = source.getRows();

  if(!allRows || allRows.length === 0){
    statusEl.textContent = `Aún no hay datos de ${source.label} cargados para descargar.`;
    return;
  }

  const scope = DOWNLOAD_PASSWORDS[pass];
  // Solo Móvil y FO tienen columna de canal (FVI/FQ) para restringir por nivel de acceso.
  // SSPP no tiene esa columna, así que se entrega completa con cualquiera de las dos claves.
  const rows = (scope === 'all' || !source.hasCanal) ? allRows : allRows.filter(r => normKey(r['CANAL']) === scope);

  if(rows.length === 0){
    statusEl.textContent = 'No hay filas que coincidan con tu nivel de acceso.';
    return;
  }

  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "BBDD");
  const fecha = new Date().toISOString().slice(0,10);
  const scopeLabel = (scope === 'all' || !source.hasCanal) ? 'Completa' : scope;
  const nombreArchivo = `BBDD_${source.label}_${scopeLabel}_${fecha}.xlsx`;
  XLSX.writeFile(wb, nombreArchivo);
  statusEl.textContent = `Descarga lista: ${rows.length.toLocaleString('es-CL')} filas de ${source.label} (${scopeLabel}).`;
}

function evoNorm(v){
  return normalizeName(String(v === undefined || v === null ? '' : v)).trim().replace(/\s+/g,' ');
}
function evoMesIndex(v){
  if(typeof v === 'number' && v >= 1 && v <= 12) return Math.round(v) - 1;
  const n = evoNorm(v);
  if(!n) return -1;
  for(let i=0;i<12;i++){ if(evoNorm(EVO_MESES[i]) === n) return i; }
  for(let i=0;i<12;i++){ if(n.length >= 3 && evoNorm(EVO_MESES[i]).startsWith(n.slice(0,3)) && n.length <= 4) return i; }
  return -1;
}
function evoNum(v){
  if(typeof v === 'number') return isFinite(v) ? v : 0;
  if(v === undefined || v === null || v instanceof Date) return 0;
  const n = Number(String(v).trim().replace(',', '.'));
  return isFinite(n) ? n : 0;
}
function evoFindCol(hdr, names){
  const norm = hdr.map(evoNorm);
  for(const n of names){
    const i = norm.indexOf(n);
    if(i >= 0) return i;
  }
  return -1;
}
// La hoja SSPP trae "AÑO" (ingreso) y "Año" (cierre): se usa la de cierre.
function evoFindYearCol(hdr){
  const idxs = [];
  hdr.forEach((h,i)=>{ if(evoNorm(h) === 'ano') idxs.push(i); });
  if(!idxs.length) return -1;
  const exact = idxs.filter(i => String(hdr[i]).trim() === 'Año');
  return exact.length ? exact[exact.length-1] : idxs[idxs.length-1];
}
function evoTexto(v){
  return String(v === undefined || v === null ? '' : v).trim().replace(/\s+/g,' ');
}
// Nombre corto del proveedor (en la hoja Fijo viene como razón social: "INVERSIONES WESELL", "ATENTO CHILE", ...)
function evoProvNombre(v){
  const t = evoTexto(v);
  const n = evoNorm(t);
  if(!n) return '';
  if(n.includes('wesell')) return 'Wesell';
  if(n.includes('global')) return 'Global';
  if(n.includes('atento')) return 'Atento';
  return t;
}
// RUT para comparar: sin puntos, guiones ni ceros al inicio
function evoRut(v){
  return String(v === undefined || v === null ? '' : v).replace(/[^0-9kK]/g,'').toUpperCase().replace(/^0+/,'');
}
function evoJefeIdx(name){
  const n = String(name === undefined || name === null ? '' : name).trim();
  return n ? jefeSortIndex(n) : JEFE_ORDER_KEYS.length;
}

function computeEvolutivoFromWorkbook(wb){
  const defs = {
    movil: { jefe:['jefe comercial'], valor:['q l'], cuentaFilas:false, soloActividad:'voz', prov:['proveedor'], cliente:['cuenta rut'], rutCliente:['rutcliente','rut cliente'] },  // en Móvil solo cuenta ACTIVIDAD = Voz (se excluye BAM)
    fo:    { jefe:['jc','jefe comercial'], valor:['cuenta'], cuentaFilas:true, prov:['nombre_empresa_seller','proveedor'], rutCliente:['rut_cliente'] },
    sspp:  { jefe:['jefe comercial'], valor:['nav gestion'], cuentaFilas:false, prov:['proveedor'], provDefault:'Atento', rutCliente:['rut'] }  // todo SSPP lo vende Atento (la hoja no trae columna de proveedor)
  };
  const hojas = {};
  wb.SheetNames.forEach(name=>{
    const n = evoNorm(name);
    if(n.includes('movil') || n.includes('voz')) hojas.movil = hojas.movil || name;
    else if(n.includes('sspp')) hojas.sspp = hojas.sspp || name;
    else if(n.includes('fijo') || n === 'fo' || n.includes('fibra')) hojas.fo = hojas.fo || name;
  });
  const faltan = EVO_SERVICIOS.filter(s => !hojas[s.key]).map(s => s.key === 'fo' ? 'Fijo' : s.label);
  if(faltan.length === EVO_SERVICIOS.length) throw new Error('no encontré las hojas Movil, Fijo y SSPP en el archivo.');

  // 1) leer filas de cada hoja
  const filas = []; // {s, j, c, mes, year, v}
  const avisos = [];
  const yearCount = {};
  EVO_SERVICIOS.forEach(serv=>{
    const sheetName = hojas[serv.key];
    if(!sheetName) return;
    const data = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], {header:1, defval:null, blankrows:false});
    if(!data.length) return;
    const hdr = data[0].map(h => h === null ? '' : h);
    const d = defs[serv.key];
    const cJefe = evoFindCol(hdr, d.jefe);
    const cAct = d.soloActividad ? evoFindCol(hdr, ['actividad']) : -1;
    let fuera = 0;
    const cMes = evoFindCol(hdr, ['mes cierre']);
    const cCanal = evoFindCol(hdr, ['canal']);
    const cSup = evoFindCol(hdr, ['supervisor']);
    const cProv = evoFindCol(hdr, d.prov);
    // clientes: la columna "Cuenta Rut" trae 1 en una sola fila por cliente y mes (si el RUT se repite en el mes, las demás filas traen 0)
    const cCli = d.cliente ? evoFindCol(hdr, d.cliente) : -1;
    // si no hay "Cuenta Rut" (FO y SSPP), el cliente se cuenta en la primera fila en que aparece su RUT dentro del mes
    const cRut = d.rutCliente ? evoFindCol(hdr, d.rutCliente) : -1;
    const rutVistos = {};
    let sinRut = 0;
    const cVal = evoFindCol(hdr, d.valor);
    const cYear = evoFindYearCol(hdr);
    if(cJefe < 0 || cMes < 0 || (cVal < 0 && !d.cuentaFilas)){
      throw new Error('en la hoja "' + sheetName + '" faltan columnas (Jefe Comercial, MES CIERRE o ' + d.valor[0].toUpperCase() + ').');
    }
    let sinMes = 0;
    for(let r=1;r<data.length;r++){
      const row = data[r];
      if(!row) continue;
      if(cAct >= 0 && evoNorm(row[cAct]) !== d.soloActividad){ if(row.some(x => x !== null && x !== '')) fuera++; continue; }
      const mes = evoMesIndex(row[cMes]);
      if(mes < 0){ if(row.some(x => x !== null && x !== '')) sinMes++; continue; }
      let v;
      if(d.cuentaFilas){
        const raw = cVal >= 0 ? row[cVal] : null;
        v = (raw === null || raw === '' || !isFinite(Number(raw))) ? 1 : Number(raw);
      } else {
        v = evoNum(row[cVal]);
      }
      const year = cYear >= 0 ? parseInt(row[cYear], 10) : NaN;
      if(isFinite(year)) yearCount[year] = (yearCount[year] || 0) + 1;
      let kv = null;
      if(cCli >= 0){
        kv = evoNum(row[cCli]);
      } else if(cRut >= 0){
        const rut = evoRut(row[cRut]);
        if(!rut){ sinRut++; kv = 0; }
        else {
          const kr = (isFinite(year) ? year : '') + '|' + mes + '|' + rut;
          kv = rutVistos[kr] ? 0 : 1;
          rutVistos[kr] = true;
        }
      }
      filas.push({ s: serv.key, j: evoJefeIdx(row[cJefe]), c: (cCanal < 0 || row[cCanal] === null || row[cCanal] === undefined) ? '' : String(row[cCanal]).trim().toUpperCase(), u: cSup < 0 ? '' : evoTexto(row[cSup]), p: (cProv < 0 ? '' : evoProvNombre(row[cProv])) || d.provDefault || '', k: kv, mes, year: isFinite(year) ? year : null, v });
    }
    if(cSup < 0) avisos.push('la hoja de ' + serv.label + ' no trae la columna SUPERVISOR');
    if(cCli < 0 && cRut < 0) avisos.push('la hoja de ' + serv.label + ' no trae columna de RUT del cliente, así que no se pudieron contar los clientes ni el ticket promedio');
    else if(d.cliente && cCli < 0) avisos.push('la hoja de ' + serv.label + ' no trae la columna "Cuenta Rut": los clientes se contaron por RUT distinto en cada mes');
    if(sinRut) avisos.push(sinRut + ' fila(s) de ' + serv.label + ' sin RUT de cliente no se contaron como cliente');
    if(d.soloActividad && cAct < 0) avisos.push('la hoja de ' + serv.label + ' no trae la columna ACTIVIDAD, así que no se pudo filtrar solo Voz');
    if(fuera) avisos.push(fuera + ' fila(s) de ' + serv.label + ' con actividad distinta de Voz no se contaron');
    if(sinMes) avisos.push(sinMes + ' fila(s) de ' + serv.label + ' sin MES CIERRE válido no se contaron');
  });

  // 2) quedarse con el año que más se repite
  let year = null, best = -1;
  Object.keys(yearCount).forEach(y=>{ if(yearCount[y] > best){ best = yearCount[y]; year = Number(y); } });
  let otrosAnios = 0;
  const agg = {};
  filas.forEach(f=>{
    if(year !== null && f.year !== null && f.year !== year){ otrosAnios++; return; }
    // una fila por servicio + jefe + canal + supervisor + proveedor (los nombres se comparan sin tildes, mayúsculas ni espacios de más)
    const k = f.s + '|' + f.j + '|' + f.c + '|' + evoNorm(f.u) + '|' + evoNorm(f.p);
    if(!agg[k]) agg[k] = { s:f.s, j:f.j, c:f.c, u:f.u, p:f.p, m:new Array(12).fill(0) };
    agg[k].m[f.mes] += f.v;
    if(f.k !== null){
      if(!agg[k].k) agg[k].k = new Array(12).fill(0);
      agg[k].k[f.mes] += f.k;
    }
  });
  // supervisores que parecen ser la misma persona escrita de dos formas (un nombre contiene todas las palabras del otro)
  EVO_SERVICIOS.forEach(serv=>{
    const nombres = {};
    Object.keys(agg).forEach(k=>{ const a = agg[k]; if(a.s === serv.key && a.u){ const n = evoNorm(a.u); if(!nombres[n]) nombres[n] = a.u; } });
    const keys = Object.keys(nombres).sort();
    const pares = [];
    keys.forEach(a=>{
      const ta = a.split(' ');
      keys.forEach(b=>{
        if(a === b) return;
        const tb = b.split(' ');
        if(ta.length < tb.length && ta.length >= 2 && ta.every(t => tb.includes(t))) pares.push('"' + nombres[a] + '" y "' + nombres[b] + '"');
      });
    });
    if(pares.length) avisos.push('en ' + serv.label + ' hay supervisores que parecen repetidos con distinto nombre: ' + pares.join(', '));
  });
  if(otrosAnios) avisos.push(otrosAnios + ' fila(s) de otros años no se contaron');
  if(faltan.length) avisos.push('no venía la hoja ' + faltan.join(', '));
  const rows = Object.keys(agg).sort().map(k=>{
    const a = agg[k];
    a.m = a.m.map(x => Math.round(x*100)/100);
    return a;
  });
  if(!rows.length) throw new Error('el archivo no tiene filas con MES CIERRE.');
  return { year: year || new Date().getFullYear(), rows, avisos, filas: filas.length - otrosAnios };
}

function computeMetasAnualFromWorkbook(wb){
  const data = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header:1, defval:null, blankrows:false});
  const out = { gerencia: null, jefes: [] };
  const avisos = [];
  let cur = null, labelCol = 0, mesCols = null;
  const servDe = lab => {
    const n = evoNorm(lab);
    if(!n) return null;
    if(n.includes('sspp')) return 'sspp';
    if(n.includes('voz') || n.includes('movil')) return 'movil';
    if(n === 'fo' || n.includes('fibra') || n.includes('fij')) return 'fo';
    return null;
  };
  data.forEach(row=>{
    if(!row) return;
    const norm = row.map(evoNorm);
    const iEnero = norm.indexOf('enero');
    if(iEnero >= 0){
      // fila de encabezado de un bloque: "<Nombre> | Enero | Febrero | ..."
      mesCols = new Array(12).fill(-1);
      norm.forEach((c,i)=>{ const m = EVO_MESES.findIndex(x => evoNorm(x) === c); if(m >= 0 && mesCols[m] < 0) mesCols[m] = i; });
      labelCol = 0;
      for(let i=0;i<iEnero;i++){ if(norm[i]) labelCol = i; }
      const nombre = String(row[labelCol] === null ? '' : row[labelCol]).trim();
      const n = evoNorm(nombre);
      if(n.startsWith('region') || n.startsWith('gerencia') || n.startsWith('total')){
        cur = { tipo:'gerencia', movil:new Array(12).fill(0), fo:new Array(12).fill(0), sspp:new Array(12).fill(0) };
        out.gerencia = cur;
      } else {
        const tokens = n.split(' ');
        const canal = tokens.includes('fq') ? 'FQ' : (tokens.includes('fvi') ? 'FVI' : '');
        const alias = EVO_ALIAS_JEFES[tokens[0]];
        let j = JEFE_ORDER_KEYS.findIndex(k => k.split(' ')[0] === (alias || tokens[0]));
        if(j < 0){ const t = jefeSortIndex(nombre); j = t < JEFE_ORDER_KEYS.length ? t : -1; }
        if(j < 0){ avisos.push('no reconocí el bloque "' + nombre + '"'); cur = null; return; }
        cur = { tipo:'jefe', j, c: canal, de: alias ? nombre : null, movil:new Array(12).fill(0), fo:new Array(12).fill(0), sspp:new Array(12).fill(0) };
        out.jefes.push(cur);
      }
      return;
    }
    if(!cur || !mesCols) return;
    const serv = servDe(row[labelCol]);
    if(!serv) return;
    for(let m=0;m<12;m++){ if(mesCols[m] >= 0) cur[serv][m] = evoNum(row[mesCols[m]]); }
  });
  if(!out.gerencia && !out.jefes.length) throw new Error('no encontré bloques de metas (una fila con el nombre y los meses Enero, Febrero, ...).');
  const clean = b => ({ movil:b.movil, fo:b.fo, sspp:b.sspp });
  return {
    gerencia: out.gerencia ? clean(out.gerencia) : null,
    jefes: out.jefes.map(b => Object.assign({ j:b.j, c:b.c }, b.de ? { de:b.de } : {}, clean(b))),
    avisos
  };
}

function isValidEvoVentas(d){
  return d && Array.isArray(d.rows) && d.rows.every(r => r && typeof r.s === 'string' && Array.isArray(r.m) && r.m.length === 12);
}
function isValidEvoMetas(d){
  const ok = b => b && ['movil','fo','sspp'].every(k => Array.isArray(b[k]) && b[k].length === 12);
  return d && Array.isArray(d.jefes) && d.jefes.every(ok) && (d.gerencia === null || d.gerencia === undefined || ok(d.gerencia));
}

async function loadRemoteEvolutivo(){
  try{
    const [rv, rm] = await Promise.all([fetch('/api/get-data?key=evolutivo-data'), fetch('/api/get-data?key=evolutivo-metas')]);
    let changed = false;
    if(rv.ok){ const j = await rv.json(); if(isValidEvoVentas(j) && j.rows.length){ EVO_VENTAS = j; changed = true; } }
    if(rm.ok){ const j = await rm.json(); if(isValidEvoMetas(j) && (j.gerencia || j.jefes.length)){ EVO_METAS = j; changed = true; } }
    if(changed && activeTab === 'evolutivo') renderContent();
  } catch(e){
    console.log('Sin evolutivo guardado todavía; se usan los valores iniciales.');
  }
  evoCargarIndiceArchivo();
}

async function evoSave(key, data, password){
  const res = await fetch('/api/save-data', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ password, key, data })
  });
  const result = await res.json();
  if(!res.ok){
    const err = new Error(result.error || 'no se pudo guardar. Revisa la clave.');
    err.status = res.status;
    throw err;
  }
}

}
async function evoFetchJson(key, stamp){
  const res = await fetch('/api/get-data?key=' + encodeURIComponent(key) + '&t=' + encodeURIComponent(stamp || Date.now()), { cache: 'no-store' });
  if(!res.ok) throw new Error('el servidor respondió ' + res.status);
  return res.json();
}
async function evoCargarIndiceArchivo(){
  try{
    const d = await evoFetchJson(EVO_FILE_KEY);
    const nuevo = evoValidFileIndex(d) ? d : null;
    const cambio = (nuevo ? nuevo.id : null) !== (EVO_FILE ? EVO_FILE.id : null);
    EVO_FILE = nuevo;
    if(cambio && activeTab === 'evolutivo' && !evoDlBusy) renderContent();
  } catch(e){
    console.log('Sin archivo Evolutivo guardado para descarga.');
  }
}
function evoBytesToB64(bytes){
  let bin = '';
  const paso = 0x8000;
  for(let i=0;i<bytes.length;i+=paso) bin += String.fromCharCode.apply(null, bytes.subarray(i, i+paso));
  return btoa(bin);
}
function evoB64ToBytes(b64){
  const bin = atob(b64);
  const out = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) out[i] = bin.charCodeAt(i);
  return out;
}
async function evoSha256(buf){
  if(!(window.crypto && crypto.subtle)) return null;
  const h = await crypto.subtle.digest('SHA-256', buf);
  return Array.from(new Uint8Array(h)).map(b => b.toString(16).padStart(2,'0')).join('');
}
// guarda con hasta 3 intentos (una red inestable puede cortar una subida); una clave incorrecta no se reintenta
async function evoSaveRetry(key, data, password){
  let ultimo = null;
  for(let intento=0; intento<3; intento++){
    try{ await evoSave(key, data, password); return; }
    catch(e){
      ultimo = e;
      if(e.status === 401 || e.status === 400) throw e;
      await new Promise(r => setTimeout(r, 800 * (intento + 1)));
    }
  }
  throw ultimo;
}
async function evoGuardarArchivo(file, buf, password, onProgress){
  if(file.size > EVO_FILE_MAX_BYTES) throw new Error('pesa ' + Math.round(file.size/1024/1024) + ' MB y el máximo para dejarlo descargable es ' + Math.round(EVO_FILE_MAX_BYTES/1024/1024) + ' MB');
  const b64 = evoBytesToB64(new Uint8Array(buf));
  const total = Math.ceil(b64.length / EVO_FILE_PART_CHARS);
  const id = new Date().toISOString();
  const sha256 = await evoSha256(buf);
  for(let i=0;i<total;i++){
    if(onProgress) onProgress(i + 1, total);
    await evoSaveRetry(EVO_FILE_KEY + '-p' + i, { id, i, b64: b64.slice(i * EVO_FILE_PART_CHARS, (i + 1) * EVO_FILE_PART_CHARS) }, password);
  }
  // el índice se guarda al final: mientras no cambie, se sigue ofreciendo el archivo anterior
  const indice = { id, name: file.name, mime: file.type || 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet', size: file.size, parts: total, sha256, updatedAt: id };
  await evoSaveRetry(EVO_FILE_KEY, indice, password);
  EVO_FILE = indice;
}
function evoPesoTxt(bytes){
  return (bytes / 1024 / 1024).toLocaleString('es-CL', { minimumFractionDigits:1, maximumFractionDigits:1 }) + ' MB';
}

async function evoDescargarArchivo(){
  if(evoDlBusy) return;
  const st = document.getElementById('evo-dl-status');
  const inp = document.getElementById('evo-dl-password');
  const btn = document.getElementById('evo-dl-go');
  const pass = inp ? inp.value : '';
  if(!pass){ st.textContent = 'Ingresa la clave de descarga.'; return; }
  if(!DOWNLOAD_PASSWORDS.hasOwnProperty(pass) || DOWNLOAD_PASSWORDS[pass] !== 'all'){
    st.textContent = 'Clave incorrecta. Este archivo se descarga solo con la clave de Gerencia.';
    return;
  }
  evoDlBusy = true;
  if(btn) btn.disabled = true;
  try{
    st.textContent = 'Preparando descarga...';
    const idx = await evoFetchJson(EVO_FILE_KEY);
    if(!evoValidFileIndex(idx)) throw new Error('todavía no hay un archivo guardado');
    const trozos = [];
    let bytes = 0;
    for(let i=0;i<idx.parts;i++){
      st.textContent = 'Descargando... parte ' + (i + 1) + ' de ' + idx.parts;
      const part = await evoFetchJson(EVO_FILE_KEY + '-p' + i, idx.id);
      if(!part || part.id !== idx.id || typeof part.b64 !== 'string') throw new Error('ACTUALIZANDO');
      const u8 = evoB64ToBytes(part.b64);
      bytes += u8.length;
      trozos.push(u8);
    }
    if(bytes !== idx.size) throw new Error('ACTUALIZANDO');
    const blob = new Blob(trozos, { type: idx.mime || 'application/octet-stream' });
    if(idx.sha256){
      const h = await evoSha256(await blob.arrayBuffer());
      if(h && h !== idx.sha256) throw new Error('ACTUALIZANDO');
    }
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = idx.name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 60000);
    st.textContent = 'Descarga lista: ' + idx.name + ' (' + evoPesoTxt(idx.size) + ').';
    if(inp) inp.value = '';
  } catch(e){
    st.textContent = e.message === 'ACTUALIZANDO'
      ? 'El archivo se está actualizando en este momento. Espera un minuto y vuelve a intentar.'
      : 'No se pudo descargar (' + e.message + '). Revisa tu conexión y vuelve a intentar.';
  } finally {
    evoDlBusy = false;
    if(btn) btn.disabled = false;
  }
}
