// ----- series -----
function evoFmt(n){ return Math.round(n).toLocaleString('es-CL'); }
function evoPct(v, meta){ return meta > 0 ? Math.round((v/meta)*100) : null; }

// jefe = null -> Gerencia (todas las filas); jefe = 0..5 -> ese Jefe Comercial (FVI + FQ)
function evoSerie(serv, jefe){
  const venta = new Array(12).fill(0), meta = new Array(12).fill(0), cli = new Array(12).fill(0);
  let hayCli = false;
  EVO_VENTAS.rows.forEach(r=>{
    if(r.s !== serv) return;
    if(jefe !== null && r.j !== jefe) return;
    for(let m=0;m<12;m++) venta[m] += r.m[m] || 0;
    if(Array.isArray(r.k)){ hayCli = true; for(let m=0;m<12;m++) cli[m] += r.k[m] || 0; }
  });
  if(jefe === null && EVO_METAS.gerencia){
    for(let m=0;m<12;m++) meta[m] = EVO_METAS.gerencia[serv][m] || 0;
  } else {
    EVO_METAS.jefes.forEach(b=>{
      if(jefe !== null && b.j !== jefe) return;
      for(let m=0;m<12;m++) meta[m] += b[serv][m] || 0;
    });
  }
  return { venta, meta, clientes: hayCli ? cli : null };
}
// ticket promedio = líneas vendidas / clientes (con 1 decimal)
function evoDec(n){ return n.toLocaleString('es-CL', { minimumFractionDigits:1, maximumFractionDigits:1 }); }
function evoTicket(venta, clientes){ return clientes > 0 ? evoDec(venta / clientes) : '—'; }
function evoAcumCli(serie, last){ let c = 0; for(let m=0;m<=last;m++) c += serie.clientes[m]; return c; }
// último mes (0-11) con alguna venta cargada, en cualquier servicio
function evoUltimoMes(){
  let last = -1;
  EVO_VENTAS.rows.forEach(r=>{ for(let m=0;m<12;m++){ if(r.m[m] > 0 && m > last) last = m; } });
  return last;
}
function evoAcum(serie, last){
  let v = 0, mt = 0;
  for(let m=0;m<=last;m++){ v += serie.venta[m]; mt += serie.meta[m]; }
  return { venta: v, meta: mt, pct: evoPct(v, mt) };
}
function evoRango(last){ return last <= 0 ? EVO_MESES_ABR[0] : EVO_MESES_ABR[0] + '–' + EVO_MESES_ABR[last]; }
function evoStatusColor(pct){
  const cs = getComputedStyle(document.documentElement);
  if(pct >= 95) return cs.getPropertyValue('--green').trim();
  if(pct >= 80) return cs.getPropertyValue('--amber').trim();
  return cs.getPropertyValue('--red').trim();
}

// ----- gráfico: barras = venta, línea = meta, y debajo la tabla alineada Venta / Meta / % Cump -----
function evoTicks(maxVal){
  if(maxVal <= 0) return { step: 1, max: 4 };
  const raw = maxVal / 4;
  const p = Math.pow(10, Math.floor(Math.log10(raw)));
  const f = raw / p;
  const step = (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p;
  return { step, max: step * Math.ceil(maxVal / step) };
}

// tamaño de letra de las filas Venta / Meta / % Cump: que el número más largo quepa en el ancho de cada mes
function evoRawFs(serie, n, band){
  let maxChars = 4;
  for(let i=0;i<n;i++){
    const p = evoPct(serie.venta[i], serie.meta[i]);
    maxChars = Math.max(maxChars, evoFmt(serie.venta[i]).length, evoFmt(serie.meta[i]).length, p === null ? 0 : String(p).length + 2);
  }
  return Math.floor(((band - 4) / (maxChars * 0.58)) * 2) / 2;
}
const EVO_GUT = 50, EVO_PAD_R = 4;

function evoChartSVG(serie, last, W, titulo){
  const n = last + 1;
  const gut = EVO_GUT, padR = EVO_PAD_R, top = 10, plotH = 160;
  const band = (W - gut - padR) / n;
  const bw = Math.min(24, Math.max(6, band * 0.6));
  const fs = Math.max(8.5, Math.min(10.5, evoRawFs(serie, n, band)));
  const y0 = top + plotH;
  const H = y0 + 82 + (serie.clientes ? 32 : 0);
  let maxVal = 0;
  for(let i=0;i<n;i++) maxVal = Math.max(maxVal, serie.venta[i], serie.meta[i]);
  const tk = evoTicks(maxVal);
  const y = v => y0 - (v / tk.max) * plotH;
  const cx = i => gut + i*band + band/2;
  const muted = '#64748B', ink = '#1A2733', line = '#DBE3EC';
  let g = '';

  for(let t=0; t<=tk.max + tk.step/2; t+=tk.step){
    const yy = y(t).toFixed(1);
    g += `<line x1="${gut}" x2="${W-padR}" y1="${yy}" y2="${yy}" stroke="${line}" stroke-width="1"/>`;
    g += `<text x="${gut-7}" y="${(y(t)+3.5).toFixed(1)}" text-anchor="end" font-size="10" fill="${muted}">${evoFmt(t)}</text>`;
  }
  // barras (venta)
  for(let i=0;i<n;i++){
    const v = serie.venta[i];
    if(v <= 0) continue;
    const x = cx(i) - bw/2, yt = y(v), h = y0 - yt;
    const r = Math.min(4, h, bw/2);
    g += `<path d="M${x.toFixed(1)},${y0} V${(yt+r).toFixed(1)} Q${x.toFixed(1)},${yt.toFixed(1)} ${(x+r).toFixed(1)},${yt.toFixed(1)} H${(x+bw-r).toFixed(1)} Q${(x+bw).toFixed(1)},${yt.toFixed(1)} ${(x+bw).toFixed(1)},${(yt+r).toFixed(1)} V${y0} Z" fill="${EVO_BAR_COLOR}"/>`;
  }
  // línea de meta (solo meses con meta > 0), con halo blanco para que se lea sobre las barras
  let run = [];
  const flush = ()=>{
    if(run.length > 1){
      const pts = run.map(i => cx(i).toFixed(1) + ',' + y(serie.meta[i]).toFixed(1)).join(' ');
      g += `<polyline points="${pts}" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>`;
      g += `<polyline points="${pts}" fill="none" stroke="${EVO_META_COLOR}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    }
    run = [];
  };
  for(let i=0;i<n;i++){ if(serie.meta[i] > 0) run.push(i); else flush(); }
  flush();
  for(let i=0;i<n;i++){
    if(serie.meta[i] > 0) g += `<circle cx="${cx(i).toFixed(1)}" cy="${y(serie.meta[i]).toFixed(1)}" r="4" fill="${EVO_META_COLOR}" stroke="#FFFFFF" stroke-width="2"/>`;
  }
  // eje X + filas alineadas
  g += `<line x1="${gut}" x2="${W-padR}" y1="${y0}" y2="${y0}" stroke="#B9C4D0" stroke-width="1"/>`;
  g += `<line x1="0" x2="${W-padR}" y1="${y0+24}" y2="${y0+24}" stroke="${line}" stroke-width="1"/>`;
  const rows = [['Venta', y0+40], ['Meta', y0+56], ['% Cump', y0+72]];
  if(serie.clientes) rows.push(['Clientes', y0+88], ['Ticket', y0+104]);
  rows.forEach(r=>{ g += `<text x="0" y="${r[1]}" font-size="${fs}" fill="${muted}">${r[0]}</text>`; });
  for(let i=0;i<n;i++){
    const v = serie.venta[i], mt = serie.meta[i], p = evoPct(v, mt);
    const x = cx(i).toFixed(1);
    g += `<text x="${x}" y="${y0+16}" text-anchor="middle" font-size="${fs}" fill="${muted}">${EVO_MESES_ABR[i]}</text>`;
    g += `<text x="${x}" y="${y0+40}" text-anchor="middle" font-size="${fs}" font-weight="600" fill="${ink}">${evoFmt(v)}</text>`;
    g += `<text x="${x}" y="${y0+56}" text-anchor="middle" font-size="${fs}" fill="${muted}">${mt > 0 ? evoFmt(mt) : '—'}</text>`;
    g += p === null
      ? `<text x="${x}" y="${y0+72}" text-anchor="middle" font-size="${fs}" fill="${muted}">—</text>`
      : `<text x="${x}" y="${y0+72}" text-anchor="middle" font-size="${fs}" font-weight="700" fill="${evoStatusColor(p)}">${p}%</text>`;
    if(serie.clientes){
      const c = serie.clientes[i];
      g += `<text x="${x}" y="${y0+88}" text-anchor="middle" font-size="${fs}" font-weight="600" fill="${ink}">${evoFmt(c)}</text>`;
      g += `<text x="${x}" y="${y0+104}" text-anchor="middle" font-size="${fs}" font-weight="700" fill="#001EB4">${evoTicket(v, c)}</text>`;
    }
  }
  // zonas de hover / foco (una por mes, de alto completo)
  for(let i=0;i<n;i++){
    const v = serie.venta[i], mt = serie.meta[i], p = evoPct(v, mt);
    const aria = `${EVO_MESES[i]}: venta ${evoFmt(v)}, meta ${mt > 0 ? evoFmt(mt) : 'sin meta'}${p === null ? '' : ', cumplimiento ' + p + '%'}`;
    g += `<rect class="evo-hit" tabindex="0" role="img" aria-label="${aria}" x="${(gut+i*band).toFixed(1)}" y="${top}" width="${band.toFixed(1)}" height="${H-top}" data-t="${escapeHtmlAttr(EVO_MESES[i] + ' · ' + titulo)}" data-v="${v}" data-m="${mt}" onpointermove="evoTipShow(event,this)" onpointerleave="evoTipHide()" onfocus="evoTipShow(null,this)" onblur="evoTipHide()"/>`;
  }
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="group" aria-label="Venta mensual y meta: ${escapeHtmlAttr(titulo)}">${g}</svg>`;
}

function evoTipShow(ev, el){
  let tip = document.getElementById('evo-tip');
  if(!tip){ tip = document.createElement('div'); tip.id = 'evo-tip'; document.body.appendChild(tip); }
  const v = Number(el.dataset.v), mt = Number(el.dataset.m), p = evoPct(v, mt);
  tip.textContent = '';
  const add = (cls, a, b) => {
    const d = document.createElement('div'); d.className = cls;
    if(b === undefined){ d.textContent = a; }
    else { const s = document.createElement('span'); s.textContent = a; const st = document.createElement('b'); st.textContent = b; d.appendChild(s); d.appendChild(st); }
    tip.appendChild(d);
  };
  add('t', el.dataset.t);
  add('r', 'Venta', evoFmt(v));
  add('r', 'Meta', mt > 0 ? evoFmt(mt) : 'sin meta');
  if(p !== null){
    add('r', '% Cumplimiento', p + '%');
    const dif = Math.round(v) - Math.round(mt);
    add('r', dif >= 0 ? 'Sobre la meta' : 'Bajo la meta', (dif >= 0 ? '+' : '−') + Math.abs(dif).toLocaleString('es-CL'));
  }
  tip.style.display = 'block';
  let x, yy;
  if(ev){ x = ev.clientX + 14; yy = ev.clientY + 14; }
  else { const b = el.getBoundingClientRect(); x = b.right + 6; yy = b.top + 20; }
  const tw = tip.offsetWidth, th = tip.offsetHeight;
  if(x + tw > window.innerWidth - 8) x = Math.max(8, (ev ? ev.clientX : x) - tw - 14);
  if(yy + th > window.innerHeight - 8) yy = Math.max(8, window.innerHeight - th - 8);
  tip.style.left = x + 'px';
  tip.style.top = yy + 'px';
}
function evoTipHide(){
  const tip = document.getElementById('evo-tip');
  if(tip) tip.style.display = 'none';
}

function evoCardHTML(serv, jefe, last){
  const serie = evoSerie(serv.key, jefe);
  const tieneAlgo = serie.venta.some(x => x > 0) || serie.meta.some(x => x > 0);
  const ac = evoAcum(serie, last);
  const head = `<div class="evo-card-head">
      <div class="evo-card-title">${serv.label}<span class="evo-card-unit">${serv.unidad}</span></div>
      ${tieneAlgo ? evoLegendHTML() : ''}
    </div>`;
  if(!tieneAlgo){
    return `<div class="evo-card">${head}<div class="evo-empty">Sin ventas ni meta de ${serv.label} en ${EVO_VENTAS.year}.</div></div>`;
  }
  const acum = `<div class="evo-acum">Acumulado ${evoRango(last)}: <b>${evoFmt(ac.venta)}</b>${ac.meta > 0 ? ' de ' + evoFmt(ac.meta) + ' · <span class="pill ' + pillClass(ac.pct) + '">' + ac.pct + '%</span>' : ''}</div>`;
  return `<div class="evo-card">${head}${acum}<div class="evo-chart" data-serv="${serv.key}" data-jefe="${jefe === null ? '' : jefe}"></div></div>`;
}

function evoTablaHTML(last){
  const serv = EVO_SERVICIOS.find(s => s.key === evoTablaServ) || EVO_SERVICIOS[0];
  const chips = EVO_SERVICIOS.map(s => `<button class="${s.key === serv.key ? 'active' : ''}" onclick="evoSetTablaServ('${s.key}')">${s.label}</button>`).join('');
  const cell = (v, mt) => {
    const p = evoPct(v, mt);
    if(p === null) return `<td class="evo-nometa"><div class="evo-v">${evoFmt(v)}</div><div class="evo-m">sin meta</div>—</td>`;
    return `<td><div class="evo-v">${evoFmt(v)}</div><div class="evo-m">de ${evoFmt(mt)}</div><span class="pill ${pillClass(p)}">${p}%</span></td>`;
  };
  const fila = (nombre, serie, cls) => {
    let tds = '';
    for(let m=0;m<=last;m++) tds += cell(serie.venta[m], serie.meta[m]);
    const ac = evoAcum(serie, last);
    return `<tr class="${cls||''}"><td>${nombre}</td>${tds}${cell(ac.venta, ac.meta)}</tr>`;
  };
  let body = '';
  const sumaJefes = new Array(12).fill(0);
  METAS_JEFES.forEach((nombre, j)=>{
    const s = evoSerie(serv.key, j);
    for(let m=0;m<12;m++) sumaJefes[m] += s.meta[m];
    if(!s.venta.some(x => x > 0) && !s.meta.some(x => x > 0)) return;
    body += fila(nombre, s);
  });
  const ger = evoSerie(serv.key, null);
  body += fila('Gerencia', ger, 'total-row');
  let ths = '';
  for(let m=0;m<=last;m++) ths += `<th>${EVO_MESES_ABR[m]}</th>`;

  const notas = [];
  const difs = [];
  for(let m=0;m<=last;m++){ if(EVO_METAS.gerencia && Math.round(ger.meta[m]) !== Math.round(sumaJefes[m])) difs.push(EVO_MESES_ABR[m]); }
  if(difs.length) notas.push('La meta de Gerencia es la del bloque "Regiones" del archivo de metas; en ' + difs.join(', ') + ' no coincide con la suma de las metas de los Jefes Comerciales.');
  EVO_METAS.jefes.forEach(b=>{
    if(!b.de) return;
    const meses = [];
    for(let m=0;m<=last;m++){ if(b[serv.key][m] > 0) meses.push(m); }
    if(!meses.length) return;
    const rango = meses.length > 1 ? EVO_MESES_ABR[meses[0]] + '–' + EVO_MESES_ABR[meses[meses.length-1]] : EVO_MESES_ABR[meses[0]];
    notas.push('La meta de ' + METAS_JEFES[b.j] + ' incluye la de ' + escapeHtmlAttr(b.de) + ' (' + rango + '), cuyas cifras pasaron a su cargo.');
  });
  const sinJefe = evoAcum(evoSerie(serv.key, JEFE_ORDER_KEYS.length), last).venta;
  if(sinJefe > 0) notas.push('La fila Gerencia incluye ' + evoFmt(sinJefe) + ' de venta sin Jefe Comercial reconocido.');

  return `
    <div class="section-label">Evolutivo ${EVO_VENTAS.year || ''} — Venta por mes · Todos los Jefes Comerciales — ${serv.label} (${serv.unidad})</div>
    <div class="evo-chips">${chips}</div>
    <div class="general-table-wrap">
      <table class="general evo-table">
        <thead><tr class="sub-row"><th class="name-col">Jefe Comercial</th>${ths}<th>Acumulado ${evoRango(last)}</th></tr></thead>
        <tbody>${body}</tbody>
      </table>
    </div>
    <p class="evo-note">En cada celda: venta del mes, meta y % de cumplimiento. Cada Jefe Comercial suma sus canales FVI y FQ.${notas.length ? ' ' + notas.join(' ') : ''}</p>`;
}

// ----- apartado "Clientes y ticket promedio" (Móvil, FO y SSPP) -----
function evoCliCell(v, c, serv){
  return `<td><div class="evo-v">${evoFmt(c)}</div><div class="evo-m">${evoFmt(v)} ${serv.corto}</div><span class="evo-tk">${evoTicket(v, c)}</span></td>`;
}
function evoCliFila(nombre, rows, last, serv, cls){
  const v = evoSumaMeses(rows), c = evoSumaClientes(rows);
  let tds = '';
  for(let m=0;m<=last;m++) tds += evoCliCell(v[m], c[m], serv);
  return `<tr class="${cls||''}"><td>${nombre}</td>${tds}${evoCliCell(evoAcumVenta(v, last), evoAcumVenta(c, last), serv)}</tr>`;
}
function evoCliTablaHTML(colNombre, body, last){
  let ths = '';
  for(let m=0;m<=last;m++) ths += `<th>${EVO_MESES_ABR[m]}</th>`;
  return `<div class="general-table-wrap">
      <table class="general evo-table">
        <thead><tr class="sub-row"><th class="name-col">${colNombre}</th>${ths}<th>Acumulado ${evoRango(last)}</th></tr></thead>
        <tbody>${body}</tbody>
      </table>
    </div>`;
}
function evoClientesVistaHTML(last){
  const year = EVO_VENTAS.year || '';
  const aviso = txt => `<div class="donut-card" style="max-width:560px;"><p style="font-size:0.9rem; color:var(--muted); margin:0;">${txt}</p></div>`;
  if(!EVO_VENTAS.rows.some(r => Array.isArray(r.k))){
    return aviso('Los datos guardados todavía no traen los clientes. Vuelve a subir el archivo Evolutivo en la pestaña "Cargar datos" para ver este apartado.');
  }
  const kpis = EVO_SERVICIOS.map(s=>{
    const rows = EVO_VENTAS.rows.filter(r => r.s === s.key);
    const label = 'Ticket promedio ' + s.label + ' ' + evoRango(last);
    if(!rows.some(r => Array.isArray(r.k))) return { value: '—', label, sub: 'sin clientes cargados' };
    const v = evoAcumVenta(evoSumaMeses(rows), last), c = evoAcumVenta(evoSumaClientes(rows), last);
    return { value: evoTicket(v, c), label, sub: evoFmt(v) + ' ' + s.corto + ' en ' + evoFmt(c) + ' clientes' };
  });
  const serv = EVO_SERVICIOS.find(s => s.key === evoCliServ) || EVO_SERVICIOS[0];
  const chips = EVO_SERVICIOS.map(s => `<button class="${s.key === serv.key ? 'active' : ''}" onclick="evoSetCliServ('${s.key}')">${s.label}</button>`).join('');
  const rows = EVO_VENTAS.rows.filter(r => r.s === serv.key);
  const cabeza = `${kpiRowHTML(kpis)}<div class="evo-chips">${chips}</div>`;
  if(!rows.some(r => Array.isArray(r.k))){
    return cabeza + aviso('Los datos guardados de ' + serv.label + ' todavía no traen los clientes. Vuelve a subir el archivo Evolutivo en la pestaña "Cargar datos".');
  }

  // 1) por Jefe Comercial
  let bodyJefes = '';
  for(let j=0;j<=JEFE_ORDER_KEYS.length;j++){
    const rj = rows.filter(r => r.j === j);
    if(!rj.length || (!evoSumaMeses(rj).some(x => x !== 0) && !evoSumaClientes(rj).some(x => x !== 0))) continue;
    bodyJefes += evoCliFila(j < METAS_JEFES.length ? METAS_JEFES[j] : 'Sin Jefe Comercial reconocido', rj, last, serv);
  }
  bodyJefes += evoCliFila('Gerencia', rows, last, serv, 'total-row');

  // 3) por proveedor
  const grupos = {};
  rows.forEach(r=>{ const k = r.p || ''; if(!grupos[k]) grupos[k] = []; grupos[k].push(r); });
  const orden = n => { if(!n) return 99; const i = EVO_PROV_ORDEN.indexOf(n); return i < 0 ? 50 : i; };
  let bodyProv = '';
  Object.keys(grupos).sort((a,b) => (orden(a) - orden(b)) || a.localeCompare(b, 'es')).forEach(k=>{
    if(!evoSumaMeses(grupos[k]).some(x => x !== 0)) return;
    bodyProv += evoCliFila(k ? escapeHtmlAttr(k) : 'Sin proveedor', grupos[k], last, serv);
  });
  bodyProv += evoCliFila('Total ' + serv.label, rows, last, serv, 'total-row');

  const comoCuenta = serv.key === 'movil'
    ? 'Los clientes de Móvil se cuentan con la columna "Cuenta Rut" del archivo'
    : 'Los clientes de ' + serv.label + ' se cuentan por RUT distinto dentro de cada mes';
  return `
    ${cabeza}
    <div class="section-label">Evolutivo ${year} — Clientes y ticket promedio · Jefe Comercial — ${serv.label}</div>
    ${evoCliTablaHTML('Jefe Comercial', bodyJefes, last)}
    <p class="evo-note">En cada celda: clientes del mes, ${serv.corto} y, en azul, el ticket promedio (${serv.corto} ÷ clientes). ${comoCuenta}: un cliente cuenta una sola vez en el mes aunque tenga varias ventas. El acumulado suma los clientes de cada mes, así que un cliente que compró en dos meses distintos cuenta dos veces.</p>
    <div class="evo-gap"></div>

    ${evoSupHTML(last, 'clientes')}

    <div class="section-label">Evolutivo ${year} — Clientes y ticket promedio · Proveedor — ${serv.label}</div>
    ${evoCliTablaHTML('Proveedor', bodyProv, last)}
    <p class="evo-note">Atento es el canal FVI; Wesell y Global son el canal FQ.</p>`;
}
function evoSetVista(k){
  evoVista = k;
  renderContent();
}
function evoSetCliServ(k){
  evoCliServ = k;
  const y = window.scrollY;
  renderContent();

}

// ----- vista por Jefe Comercial y Supervisor (FVI / FQ) y vista por proveedor -----
function evoTieneDetalle(){
  return EVO_VENTAS.rows.some(r => typeof r.u === 'string');
}
// Canal en que se muestra cada fila: FVI o FQ. En SSPP el archivo dice "Atento" desde mayo (es el mismo canal FVI).
// Si la fila viene sin canal, se deduce por el proveedor: Atento = FVI; Wesell y Global = FQ.
function evoCanalGrupo(r){
  const c = String(r.c || '').trim().toUpperCase();
  if(c === 'FVI' || c === 'FQ') return c;
  if(c === 'ATENTO') return 'FVI';
  if(c === ''){
    if(r.p === 'Atento') return 'FVI';
    if(r.p === 'Wesell' || r.p === 'Global') return 'FQ';
    return '';
  }
  return c;
}
// "Sup RM" ya no existe como cargo: esa venta queda sin supervisor asignado.
function evoSupNombre(u){
  const n = evoNorm(u);
  return (!n || n === 'sup rm') ? '' : evoTexto(u);
}
function evoSumaMeses(rows){
  const m = new Array(12).fill(0);
  rows.forEach(r=>{ for(let i=0;i<12;i++) m[i] += r.m[i] || 0; });
  return m;
}
function evoAcumVenta(m, last){ let v = 0; for(let i=0;i<=last;i++) v += m[i]; return v; }
function evoCeldasMes(m, last){
  let tds = '';
  for(let i=0;i<=last;i++) tds += `<td class="${Math.round(m[i]) === 0 ? 'evo-zero' : ''}">${evoFmt(m[i])}</td>`;
  return tds + `<td class="evo-acum-col">${evoFmt(evoAcumVenta(m, last))}</td>`;
}
function evoSumaClientes(rows){
  const m = new Array(12).fill(0);
  rows.forEach(r=>{ if(Array.isArray(r.k)){ for(let i=0;i<12;i++) m[i] += r.k[i] || 0; } });
  return m;
}
// celdas de una fila según lo que se quiera ver: líneas, clientes o ticket promedio (líneas ÷ clientes)
function evoCeldasMetrica(rows, last, metrica){
  const v = evoSumaMeses(rows);
  if(metrica === 'lineas') return evoCeldasMes(v, last);
  const c = evoSumaClientes(rows);
  if(metrica === 'clientes') return evoCeldasMes(c, last);
  let tds = '';
  for(let i=0;i<=last;i++) tds += `<td class="${c[i] > 0 ? '' : 'evo-zero'}">${evoTicket(v[i], c[i])}</td>`;
  return tds + `<td class="evo-acum-col">${evoTicket(evoAcumVenta(v, last), evoAcumVenta(c, last))}</td>`;
}
function evoThsMes(last){
  let ths = '';
  for(let m=0;m<=last;m++) ths += `<th>${EVO_MESES_ABR[m]}</th>`;
  return ths + `<th class="evo-acum-col">Acumulado ${evoRango(last)}</th>`;
}
function evoSupTablaHTML(serv, canal, rows, last, metrica){
  const unidad = metrica === 'clientes' ? 'clientes' : (metrica === 'ticket' ? 'ticket promedio (' + serv.corto + ' por cliente)' : serv.unidad);
  const titulo = canal ? 'Canal ' + canal : 'Sin canal';
  if(!rows.length || !evoSumaMeses(rows).some(x => x !== 0)){
    return `<div class="evo-sub-label">${titulo}</div><p class="evo-note" style="margin:0 0 6px;">Sin ventas de ${serv.label} en ${canal ? 'el canal ' + canal : 'filas sin canal'} en ${EVO_VENTAS.year}.</p>`;
  }
  let body = '';
  for(let j=0;j<=JEFE_ORDER_KEYS.length;j++){
    const rj = rows.filter(r => r.j === j);
    if(!rj.length) continue;
    const mj = evoSumaMeses(rj);
    if(!mj.some(x => x !== 0)) continue;
    const nombreJefe = j < METAS_JEFES.length ? METAS_JEFES[j] : 'Sin Jefe Comercial reconocido';
    body += `<tr class="evo-jefe-row"><td>${nombreJefe}</td>${evoCeldasMetrica(rj, last, metrica)}</tr>`;
    const sups = {};
    rj.forEach(r=>{
      const nombre = evoSupNombre(r.u);
      const k = evoNorm(nombre);
      if(!sups[k]) sups[k] = { nombre, m: new Array(12).fill(0), rows: [] };
      for(let i=0;i<12;i++) sups[k].m[i] += r.m[i] || 0;
      sups[k].rows.push(r);
    });
    Object.keys(sups).map(k => sups[k])
      .map(o => Object.assign(o, { ac: evoAcumVenta(o.m, last) }))
      .sort((a,b) => ((a.nombre ? 0 : 1) - (b.nombre ? 0 : 1)) || (b.ac - a.ac) || a.nombre.localeCompare(b.nombre, 'es'))
      .forEach(o=>{
        body += `<tr class="evo-sup-row"><td>${o.nombre ? escapeHtmlAttr(o.nombre) : 'Sin supervisor asignado'}</td>${evoCeldasMetrica(o.rows, last, metrica)}</tr>`;
      });
  }
  body += `<tr class="total-row"><td>Total ${canal || 'sin canal'}</td>${evoCeldasMetrica(rows, last, metrica)}</tr>`;
  return `
    <div class="evo-sub-label">${titulo}<span>${serv.label} · ${unidad}</span></div>
    <div class="general-table-wrap">
      <table class="general evo-sup-table">
        <thead><tr class="sub-row"><th class="name-col">Jefe Comercial / Supervisor</th>${evoThsMes(last)}</tr></thead>
        <tbody>${body}</tbody>
      </table>
    </div>`;
}
function evoSupHTML(last, modo){
  const year = EVO_VENTAS.year || '';
  const esCli = modo === 'clientes';
  const serv = EVO_SERVICIOS.find(s => s.key === (esCli ? evoCliServ : evoSupServ)) || EVO_SERVICIOS[0];
  const label = esCli
    ? `<div class="section-label">Evolutivo ${year} — Clientes y ticket promedio · Jefe Comercial y Supervisor, por canal (FVI / FQ) — ${serv.label}</div>`
    : `<div class="section-label">Evolutivo ${year} — Venta por mes · Jefe Comercial y Supervisor, por canal (FVI / FQ)</div>`;
  if(!evoTieneDetalle()){
    return label + `<div class="donut-card" style="max-width:560px;"><p style="font-size:0.9rem; color:var(--muted); margin:0;">Los datos guardados todavía no traen el detalle por supervisor. Vuelve a subir el archivo Evolutivo en la pestaña "Cargar datos" para ver esta vista.</p></div><div class="evo-gap"></div>`;
  }
  const chips = EVO_SERVICIOS.map(s => `<button class="${s.key === serv.key ? 'active' : ''}" onclick="evoSetSupServ('${s.key}')">${s.label}</button>`).join('');
  const rows = EVO_VENTAS.rows.filter(r => r.s === serv.key);
  const canales = ['FVI','FQ'];
  rows.forEach(r=>{ const g = evoCanalGrupo(r); if(!canales.includes(g)) canales.push(g); });
  const metrica = esCli ? (evoSupMetrica === 'ticket' ? 'ticket' : 'clientes') : 'lineas';
  const ops = [['clientes','Clientes'],['ticket','Ticket promedio']];
  const chipsMetrica = esCli ? `<div class="evo-chips evo-chips-sm" style="margin-top:0;"><span class="evo-chips-lbl">Ver:</span>${ops.map(o => `<button class="${o[0] === metrica ? 'active' : ''}" onclick="evoSetSupMetrica('${o[0]}')">${o[1]}</button>`).join('')}</div>` : '';
  const tablas = canales.map(c => evoSupTablaHTML(serv, c, rows.filter(r => evoCanalGrupo(r) === c), last, metrica)).join('');

  const notas = [esCli
    ? 'Dentro de cada jefe, los supervisores van de mayor a menor venta acumulada. Si un cliente compró con dos supervisores en el mismo mes, cuenta solo para uno de ellos. Ticket promedio = ' + serv.corto + ' ÷ clientes.'
    : 'Aquí se muestra solo la venta, porque las metas están cargadas por Jefe Comercial y no por supervisor. Dentro de cada jefe, los supervisores van de mayor a menor venta acumulada.'];
  const comoAtento = evoAcumVenta(evoSumaMeses(rows.filter(r => String(r.c || '').toUpperCase() === 'ATENTO')), last);
  if(comoAtento) notas.push('En el archivo, parte de ' + serv.label + ' viene con canal "Atento" (' + evoFmt(comoAtento) + '): va dentro de FVI, porque FVI es Atento.');
  const sinCanal = rows.filter(r => !String(r.c || '').trim());
  const deducido = evoAcumVenta(evoSumaMeses(sinCanal.filter(r => evoCanalGrupo(r))), last);
  if(deducido) notas.push(evoFmt(deducido) + ' de venta viene sin canal en el archivo y se ubicó por su proveedor (Atento = FVI; Wesell y Global = FQ).');
  if(rows.some(r => evoNorm(r.u) === 'sup rm')) notas.push('La venta que figura a nombre de "Sup RM" se muestra como "Sin supervisor asignado".');
  return `
    ${label}
    ${esCli ? '' : '<div class="evo-chips">' + chips + '</div>'}
    ${chipsMetrica}
    ${tablas}
    <p class="evo-note">${notas.join(' ')}</p>
    <div class="evo-gap"></div>`;
}
function evoProvHTML(last){
  const year = EVO_VENTAS.year || '';
  const label = `<div class="section-label">Evolutivo ${year} — Venta por mes · Proveedor</div>`;
  if(!evoTieneDetalle()){
    return label + `<div class="donut-card" style="max-width:560px;"><p style="font-size:0.9rem; color:var(--muted); margin:0;">Los datos guardados todavía no traen el proveedor. Vuelve a subir el archivo Evolutivo en la pestaña "Cargar datos" para ver esta vista.</p></div>`;
  }
  let body = '';
  const notas = [];
  EVO_SERVICIOS.forEach(serv=>{
    const rows = EVO_VENTAS.rows.filter(r => r.s === serv.key);
    if(!rows.length) return;
    if(!rows.some(r => r.p)){
      notas.push('La hoja de ' + serv.label + ' del archivo no trae una columna de proveedor, por eso ' + serv.label + ' no aparece en esta tabla.');
      return;
    }
    const grupos = {};
    rows.forEach(r=>{
      const k = r.p || '';
      if(!grupos[k]) grupos[k] = { nombre:k, m:new Array(12).fill(0) };
      for(let i=0;i<12;i++) grupos[k].m[i] += r.m[i] || 0;
    });
    const total = evoSumaMeses(rows);
    const acTotal = evoAcumVenta(total, last);
    const orden = n => { if(!n) return 99; const i = EVO_PROV_ORDEN.indexOf(n); return i < 0 ? 50 : i; };
    const part = v => acTotal > 0 ? Math.round((v/acTotal)*100) + '%' : '—';
    body += `<tr class="evo-jefe-row"><td>${serv.label}<span class="evo-unit">${serv.unidad}</span></td>${evoCeldasMes(total, last)}<td>${acTotal > 0 ? '100%' : '—'}</td></tr>`;
    Object.keys(grupos).map(k => grupos[k])
      .filter(g => g.m.some(x => x !== 0))
      .sort((a,b) => (orden(a.nombre) - orden(b.nombre)) || a.nombre.localeCompare(b.nombre, 'es'))
      .forEach(g=>{
        body += `<tr class="evo-sup-row"><td>${g.nombre ? escapeHtmlAttr(g.nombre) : 'Sin proveedor'}</td>${evoCeldasMes(g.m, last)}<td>${part(evoAcumVenta(g.m, last))}</td></tr>`;
      });
  });
  const tabla = body ? `
    <div class="general-table-wrap">
      <table class="general evo-sup-table">
        <thead><tr class="sub-row"><th class="name-col">Servicio / Proveedor</th>${evoThsMes(last)}<th>% del total</th></tr></thead>
        <tbody>${body}</tbody>
      </table>
    </div>` : '';
  notas.unshift('"% del total" es la participación de cada proveedor en la venta acumulada del servicio. Atento es el canal FVI; Wesell y Global son el canal FQ.');
  return `${label}${tabla}<p class="evo-note">${notas.join(' ')}</p>`;
}

  window.scrollTo(0, y);

function evolutivoHTML(){
  const last = evoUltimoMes();
  if(last < 0){
    return `<div class="section-label">Evolutivo</div>
      <div class="donut-card" style="max-width:560px;"><p style="font-size:0.9rem; color:var(--muted); margin:0;">Todavía no hay datos del evolutivo. Súbelos en la pestaña "Cargar datos" (archivo Evolutivo y archivo Metas anuales).</p></div>`;
  }
  const year = EVO_VENTAS.year || '';
  const kpis = EVO_SERVICIOS.map(s=>{
    const ac = evoAcum(evoSerie(s.key, null), last);
    return ac.pct === null
      ? { value: evoFmt(ac.venta), label: s.label + ' acumulado ' + evoRango(last), sub: 'sin meta cargada' }
      : { value: ac.pct + '%', label: s.label + ' acumulado ' + evoRango(last), sub: evoFmt(ac.venta) + ' de ' + evoFmt(ac.meta) + ' ' + s.unidad, tone: pillClass(ac.pct) };
  });
  const fmtFecha = iso => new Date(iso).toLocaleString('es-CL',{timeZone:'America/Santiago',day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit',hour12:false});
  const cargas = [];
  if(EVO_VENTAS.updatedAt) cargas.push('Ventas cargadas el ' + fmtFecha(EVO_VENTAS.updatedAt));
  if(EVO_METAS.updatedAt) cargas.push('Metas cargadas el ' + fmtFecha(EVO_METAS.updatedAt));
  const chipsJefe = METAS_JEFES.map((n,j)=>`<button class="${j === evoJefeSel ? 'active' : ''}" onclick="evoSetJefe(${j})">${n}</button>`).join('');

  const vistas = `<div class="evo-vistas">
      <button class="${evoVista === 'clientes' ? '' : 'active'}" onclick="evoSetVista('ventas')">Ventas y cumplimiento</button>
      <button class="${evoVista === 'clientes' ? 'active' : ''}" onclick="evoSetVista('clientes')">Clientes y ticket promedio</button>
    </div>`;
  const pie = cargas.length ? '<p class="evo-note">' + cargas.join(' · ') + '.</p>' : '';
  // la descarga del archivo va al final de la pestaña, en las dos vistas
  const descarga = '<div class="section-label" style="margin-top:32px;">Descargar archivo Evolutivo</div>' + evoDescargaHTML();
  if(evoVista === 'clientes') return vistas + evoClientesVistaHTML(last) + pie + descarga;

  return `
    ${vistas}
    ${kpiRowHTML(kpis)}
    <div class="section-label">Evolutivo ${year} — Venta por mes · Gerencia</div>
    <div class="evo-grid">${EVO_SERVICIOS.map(s => evoCardHTML(s, null, last)).join('')}</div>

    ${evoTablaHTML(last)}
    <div class="evo-gap"></div>

    <div class="section-label">Evolutivo ${year} — Venta por mes · Detalle de un Jefe Comercial</div>
    <div class="evo-chips">${chipsJefe}</div>
    <div class="evo-grid">${EVO_SERVICIOS.map(s => evoCardHTML(s, evoJefeSel, last)).join('')}</div>

    ${evoSupHTML(last, 'ventas')}
    ${evoProvHTML(last)}
    ${pie}
    ${descarga}
  `;
}

function renderEvolutivoCharts(){
  const last = evoUltimoMes();
  if(last < 0) return;
  const n = last + 1;
  document.querySelectorAll('.evo-grid').forEach(grid=>{
    const items = Array.from(grid.querySelectorAll('.evo-chart')).map(el=>{
      const serv = EVO_SERVICIOS.find(s => s.key === el.dataset.serv);
      const jefe = el.dataset.jefe === '' ? null : Number(el.dataset.jefe);
      return { el, serie: Object.assign(evoSerie(serv.key, jefe), { clientes: null }), titulo: serv.label + (jefe === null ? ' · Gerencia' : ' · ' + METAS_JEFES[jefe]) };
    });
    // si con tres gráficos por fila los números no caben (muchos meses), se muestra uno por fila
    grid.classList.remove('evo-wide');
    const apretado = items.some(o => evoRawFs(o.serie, n, (o.el.clientWidth - EVO_GUT - EVO_PAD_R) / n) < 9);
    if(apretado) grid.classList.add('evo-wide');
    items.forEach(o=>{
      o.el.innerHTML = '';
    });
    items.forEach(o=>{
      const W = Math.max(260, Math.floor(o.el.clientWidth));
      o.el.innerHTML = evoChartSVG(o.serie, last, W, o.titulo);
    });
  });
}
function evoSetJefe(j){
  evoJefeSel = j;
  const y = window.scrollY;
  renderContent();
  window.scrollTo(0, y);
}
function evoSetTablaServ(k){
  evoTablaServ = k;
  const y = window.scrollY;
  renderContent();
  window.scrollTo(0, y);
}
let evoResizeTimer = null;
window.addEventListener('resize', ()=>{
  if(activeTab !== 'evolutivo') return;
  clearTimeout(evoResizeTimer);
  evoResizeTimer = setTimeout(renderEvolutivoCharts, 150);
});
